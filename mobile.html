<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>📱 모바일 조종실</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
/* ═══════════════════════════════════════════════════════════
   📱 아이폰 방식 폰 조종실 (2026-08-25 전면 재구축)

   홈 화면에 앱이 깔려 있고, 앱을 열어 조작한다. 알림은 위에서 내려온다.
   PC 조종실의 기능을 전부 폰 크기에 맞춰 다시 얹었다.
   ⚠️ 점수는 반드시 '더할 값'만 보낸다(/api/score/add) — 상태 전체를 보내면
      PC 와 동시에 만질 때 한쪽이 사라진다. 설정류는 /api/settings/patch 로
      바뀐 필드만 보낸다. 같은 이유다.
   ═══════════════════════════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --line:rgba(255,255,255,.09);
  --tx:#fff; --mut:#98989f; --dim:#636369;
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --amber:#ff9f0a; --gold:#ffd60a;
  --mono:'SF Mono','JetBrains Mono','Consolas',monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html, body { height:100%; overscroll-behavior:none; }
body { background:var(--bg); color:var(--tx); user-select:none;
       font-family:-apple-system,'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
button { font-family:inherit; cursor:pointer; border:none; }
input, textarea { font-family:inherit; }

/* ── 상태줄 ── */
#statusbar { position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; justify-content:space-between; align-items:center;
  padding:calc(var(--safe-top) + 10px) 18px 8px;
  font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
#sb-conn { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--mut); }
#sb-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
#sb-dot.off { background:var(--red); }

/* ── 홈 화면 ── */
#home { padding:calc(var(--safe-top) + 52px) 20px calc(var(--safe-bot) + 30px); }
#home h1 { font-size:26px; font-weight:800; letter-spacing:-.6px; margin-bottom:2px; }
#home .sub { font-size:12.5px; color:var(--mut); margin-bottom:22px; }
#grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:20px 12px; max-width:420px; margin:0 auto; }
.app { display:flex; flex-direction:column; align-items:center; gap:7px; background:none; }
.app .ic { position:relative; width:58px; height:58px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; font-size:27px;
  box-shadow:0 6px 16px rgba(0,0,0,.45); transition:transform .12s; }
.app:active .ic { transform:scale(.9); }
.app .nm { font-size:11px; font-weight:600; color:#d9d9de; letter-spacing:-.2px; }
.app .bdg { position:absolute; top:-6px; right:-8px; min-width:20px; height:20px; padding:0 5px;
  border-radius:10px; background:var(--red); color:#fff; font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
  box-shadow:0 2px 6px rgba(0,0,0,.5); }

/* ── 앱 시트 ── */
#sheet { position:fixed; inset:0; z-index:60; background:var(--bg);
  transform:translateX(102%); transition:transform .26s cubic-bezier(.32,.72,.35,1);
  display:flex; flex-direction:column; }
#sheet.on { transform:translateX(0); }
#sheet-head { display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-top) + 10px) 12px 10px;
  background:rgba(0,0,0,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:.5px solid var(--line); }
#sheet-back { background:none; color:var(--blue); font-size:16px; font-weight:600;
  display:inline-flex; align-items:center; gap:2px; padding:6px 8px 6px 2px; }
#sheet-title { font-size:16.5px; font-weight:800; letter-spacing:-.3px; }
#sheet-body { flex:1; overflow-y:auto; padding:14px 16px calc(var(--safe-bot) + 30px);
  -webkit-overflow-scrolling:touch; }

/* ── iOS 그룹 카드 부품 ── */
.grp { background:var(--card); border-radius:13px; margin-bottom:16px; overflow:hidden; }
.grp-h { font-size:12px; font-weight:600; color:var(--mut); padding:0 4px 7px; }
.cell { padding:12px 14px; border-bottom:.5px solid var(--line); }
.cell:last-child { border-bottom:none; }
.row { display:flex; align-items:center; gap:10px; }
.btn { background:var(--card2); color:var(--tx); border-radius:10px;
  padding:11px 0; font-size:14px; font-weight:700; text-align:center; }
.btn:active { filter:brightness(1.3); }
.btn.b { background:var(--blue); }
.btn.g { background:var(--green); color:#04310f; }
.btn.r { background:rgba(255,69,58,.16); color:var(--red); }
.btn.a { background:rgba(255,159,10,.16); color:var(--amber); }
.btn.big { font-size:17px; padding:15px 0; border-radius:13px; }
.btnrow { display:flex; gap:8px; }
.btnrow .btn { flex:1; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
input[type=text], input[type=number] { width:100%; background:#101012; color:#fff;
  border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15px; outline:none; }
input:focus { border-color:var(--blue); }
.hint { font-size:11.5px; color:var(--dim); line-height:1.65; padding:2px 4px; }

/* ── 대기함 카드 ── */
.don { }
.don .top { display:flex; justify-content:space-between; align-items:baseline; }
.don .who { font-size:16px; font-weight:800; }
.don .amt { font-size:16px; font-weight:800; color:var(--gold); font-family:var(--mono); }
.don .msg { font-size:13.5px; color:var(--mut); margin-top:3px; word-break:break-all; }
.don .sug { display:inline-flex; align-items:center; gap:6px; margin-top:9px; font-size:12px;
  font-weight:700; padding:5px 11px; border-radius:999px; }
.don .sug.auto { background:rgba(48,209,88,.15); color:var(--green); }
.don .sug.mid  { background:rgba(10,132,255,.14); color:#6db3ff; }
.don .sug.unk  { background:rgba(255,159,10,.14); color:var(--amber); }
.don .hist { font-size:11px; color:var(--dim); margin-top:5px; }
.don .as { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:11px; }
.don .as button { background:var(--card2); color:#fff; border-radius:10px; padding:11px 0;
  font-size:14px; font-weight:700; }
.don .as button.reco { background:var(--blue); }
.don .as button.half { color:var(--mut); }
.don.need { box-shadow:inset 3px 0 0 var(--amber); }
.empty { text-align:center; color:var(--dim); font-size:13.5px; padding:46px 0; line-height:1.8; }
.empty b { color:var(--green); font-size:15px; }

/* ── 점수판 ── */
.rk { display:flex; align-items:center; gap:11px; }
.rk .no { width:20px; text-align:center; font-size:13px; font-weight:800; color:var(--dim); font-family:var(--mono); }
.rk .no.f { color:var(--gold); }
.rk .nm { flex:1; font-size:15.5px; font-weight:700; }
.rk .pt { font-size:15.5px; font-weight:800; font-family:var(--mono); }
.rk .qs { display:flex; gap:6px; }
.rk .qs button { width:44px; padding:9px 0; border-radius:9px; background:var(--card2);
  color:var(--blue); font-size:13px; font-weight:800; }

/* ── 시그뒤집기 목표 ── */
.goal { display:flex; align-items:center; gap:11px; }
.goal img { width:58px; height:33px; object-fit:cover; border-radius:7px; flex:none; }
.goal .t { flex:1; min-width:0; }
.goal .t b { font-size:14px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.goal .t span { font-size:11.5px; color:var(--mut); font-family:var(--mono); }
.goal button { flex:none; padding:9px 15px; border-radius:9px; font-size:13px; font-weight:800;
  background:var(--card2); color:#fff; }
.goal.ok button { background:rgba(48,209,88,.15); color:var(--green); }

/* ── 알림 배너 (위에서 내려온다) ── */
#banners { position:fixed; top:calc(var(--safe-top) + 6px); left:10px; right:10px; z-index:100;
  display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.banner { pointer-events:auto; display:flex; gap:11px; align-items:center;
  background:rgba(40,40,44,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:.5px solid rgba(255,255,255,.14); border-radius:16px; padding:12px 14px;
  box-shadow:0 14px 40px rgba(0,0,0,.6);
  transform:translateY(-130%); transition:transform .32s cubic-bezier(.3,1.2,.35,1), opacity .25s; }
.banner.in { transform:translateY(0); }
.banner.out { transform:translateY(-130%); opacity:0; }
.banner .bi { width:34px; height:34px; border-radius:9px; flex:none;
  display:flex; align-items:center; justify-content:center; font-size:17px; }
.banner .bt { flex:1; min-width:0; }
.banner .bt b { font-size:13.5px; display:block; }
.banner .bt span { font-size:12px; color:var(--mut); display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── 토스트 / 패치 화면 ── */
#toast { position:fixed; left:50%; bottom:calc(var(--safe-bot) + 22px); transform:translateX(-50%);
  z-index:110; background:rgba(40,40,44,.95); border:.5px solid rgba(255,255,255,.14);
  color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:999px;
  opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
#toast.on { opacity:1; }
#patchveil { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.9); display:none;
  align-items:center; justify-content:center; text-align:center; }
#patchveil.on { display:flex; }
#patchveil .in b { display:block; font-size:20px; color:var(--gold); margin-bottom:8px; }
#patchveil .in span { font-size:13px; color:var(--mut); }
</style>
</head>
<body>

<div id="statusbar">
  <span id="sb-time" class="num">--:--</span>
  <span id="sb-conn"><span id="sb-dot"></span><span id="sb-txt">연결 중…</span><span id="sb-ver" class="num"></span></span>
</div>

<div id="home">
  <h1>조종실</h1>
  <div class="sub" id="home-sub">방송 대기 중</div>
  <div id="grid"></div>
</div>

<div id="sheet">
  <div id="sheet-head">
    <button id="sheet-back" onclick="closeApp()">‹ 홈</button>
    <span id="sheet-title"></span>
  </div>
  <div id="sheet-body"></div>
</div>

<div id="banners"></div>
<div id="toast"></div>
<div id="patchveil"><div class="in"><b>패치 진행 중</b><span>서버가 다시 켜지고 있습니다…<br>끝나면 저절로 새로 열립니다</span></div></div>

<script>
'use strict';
/* ── 인증: 주소의 ?token= 을 모든 API 와 SSE 에 싣는다 ─────────────
   ⚠️ 폰은 주소를 즐겨찾기로 쓴다. EventSource 는 헤더를 못 붙여서
      토큰을 주소에 실어야 실시간 연결이 인증된다 — 안 그러면 서버가
      대기 후원을 뺀 상태를 보내 화면이 텅 비어 보인다. */
const TOKEN = (() => { try { return new URLSearchParams(location.search).get('token') || ''; }
                       catch (e) { return ''; } })();
const _fetch = window.fetch;
window.fetch = function (r, i) {
    if (TOKEN && typeof r === 'string' && r.startsWith('/api/')) {
        i = i || {}; i.headers = i.headers || {};
        if (i.headers instanceof Headers) i.headers.set('Authorization', 'Bearer ' + TOKEN);
        else i.headers['Authorization'] = 'Bearer ' + TOKEN;
    }
    return _fetch(r, i);
};

let gd = null;
let busy = false;                  // 조작 한 건이 끝나기 전엔 다음 조작을 안 받는다
let serverOffset = 0;              // 서버 시각 - 폰 시각
let openedApp = null;
const suggest = {};                // don.id -> 판정 전체 {target, tier, why, history}
const asked = new Set();
const seenDon = new Set();         // 알림 배너용 — 이미 본 후원
let firstState = true;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => (n || 0).toLocaleString();
const players = () => gd ? ((gd.extra_game_active ? gd.extra_bjs : gd.bjs) || []) : [];

function toast(msg, ok) {
    const t = $('toast');
    t.textContent = (ok === false ? '⚠️ ' : '') + msg;
    t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}

async function api(path, body) {
    const res = await fetch(path, { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}) });
    let d = {};
    try { d = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(d.message || ('HTTP ' + res.status));
    return d;
}
/* 설정류는 바뀐 필드만 — 상태 전체를 보내면 PC 와 부딪힐 때 남의 조작을 덮는다 */
const patch = fields => api('/api/settings/patch', fields);
const addScore = payload => api('/api/score/add', payload);

/* ═══ 앱 목록 ═══ */
const APPS = [
  { id:'pending',  nm:'대기함',    ic:'📥', bg:'linear-gradient(135deg,#b8860b,#8a6508)', badge:() => (gd?.pending_donations||[]).length },
  { id:'screen',   nm:'방송 화면',  ic:'📺', bg:'linear-gradient(135deg,#ff2d55,#a3123a)' },
  { id:'rank',     nm:'점수판',    ic:'🏆', bg:'linear-gradient(135deg,#0a84ff,#0055cc)' },
  { id:'match',    nm:'대결',      ic:'⚔️', bg:'linear-gradient(135deg,#5e5ce6,#3634a3)', badge:() => gd?.match_data?.active ? '●' : 0 },
  { id:'siggame',  nm:'시그뒤집기', ic:'🃏', bg:'linear-gradient(135deg,#30d158,#1d7a35)', badge:() => gd?.siggame?.enabled ? '●' : 0 },
  { id:'slot',     nm:'슬롯',      ic:'🎰', bg:'linear-gradient(135deg,#ff375f,#a31226)' },
  { id:'roulette', nm:'룰렛',      ic:'🎡', bg:'linear-gradient(135deg,#ff9f0a,#b36b00)' },
  { id:'marquee',  nm:'전광판',    ic:'📢', bg:'linear-gradient(135deg,#64d2ff,#2b8db3)' },
  { id:'queue',    nm:'재생 대기',  ic:'🎵', bg:'linear-gradient(135deg,#bf5af2,#7d2ea8)', badge:() => (gd?.reaction_queue||[]).length },
  { id:'cmd',      nm:'빠른 명령',  ic:'⌨️', bg:'linear-gradient(135deg,#48484c,#2a2a2e)' },
  { id:'logs',     nm:'로그',      ic:'📜', bg:'linear-gradient(135deg,#8e8e93,#55555a)' },
  { id:'version',  nm:'버전',      ic:'🕹️', bg:'linear-gradient(135deg,#ac8e68,#77603f)' },
  { id:'health',   nm:'상태',      ic:'🩺', bg:'linear-gradient(135deg,#30b0c7,#1a6f80)' }
];

function renderHome() {
    $('grid').innerHTML = APPS.map(a => {
        const b = a.badge ? a.badge() : 0;
        return `<button class="app" onclick="openApp('${a.id}')">
            <span class="ic" style="background:${a.bg}">${a.ic}
              ${b ? `<span class="bdg">${b}</span>` : ''}</span>
            <span class="nm">${a.nm}</span></button>`;
    }).join('');
    if (gd) $('home-sub').textContent = gd.broadcast_active
        ? `방송 중 · 대기 ${(gd.pending_donations||[]).length}건`
        : '방송 대기 중';
}

/* ═══ 앱 열고 닫기 ═══ */
function openApp(id) {
    openedApp = id;
    const a = APPS.find(x => x.id === id);
    $('sheet-title').textContent = a ? (a.ic + ' ' + a.nm) : '';
    $('sheet').classList.add('on');
    renderApp();
    if (id === 'version') loadVersions();
    if (id === 'health') loadHealth();
}
function closeApp() {
    // 📺 방송 화면을 띄워뒀다면 닫을 때 걷는다. 그냥 두면 안 보이는 채로 계속
    //    서버에서 갱신을 받아 배터리와 데이터를 먹는다.
    if (openedApp === 'screen') $('sheet-body').innerHTML = '';
    openedApp = null; $('sheet').classList.remove('on');
}

/* SSE 갱신 때 열린 앱을 다시 그린다 — 입력 중이면 건드리지 않는다 */
function renderApp() {
    if (!openedApp) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
    const R = { screen:rScreen, pending:rPending, rank:rRank, match:rMatch, siggame:rSiggame, slot:rSlot,
                roulette:rRoulette, marquee:rMarquee, queue:rQueue, cmd:rCmd, logs:rLogs,
                version:rVersion, health:rHealth };
    if (R[openedApp]) R[openedApp]($('sheet-body'));
}

/* ═══ 📺 방송 화면 들여다보기 ═══
   지금 방송에 나가고 있는 화면 그대로를 폰에서 본다.
   ⚠️ monitor=1 로 연다. 이 표시가 없으면 두 가지 사고가 난다:
      ① 폰에서 시그니처 소리·영상 소리가 터져 나온다
      ② 폰이 재생 대기줄을 같이 꺼내가서, 방송에 나갈 시그니처를 폰이 먹는다
   ⚠️ SSE 가 올 때마다 다시 그리면 안 된다 — 그때마다 화면이 처음부터 다시 켜진다. */
function rScreen(el) {
    if (el.querySelector('#screen-frame')) return;   // 이미 띄웠으면 그대로 둔다
    el.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <button onclick="screenReload()" style="flex:1;">↻ 새로고침</button>
        <button onclick="window.open('/overlay?monitor=1','_blank')" style="flex:1;">↗ 크게 보기</button>
      </div>
      <div id="screen-wrap" style="position:relative; width:100%; overflow:hidden; border-radius:14px;
                                  background:#000; border:1px solid rgba(255,255,255,.14);">
        <iframe id="screen-frame" src="/overlay?monitor=1" title="방송 화면"
                style="width:1080px; height:1920px; border:0; transform-origin:top left; display:block;"></iframe>
      </div>
      <div style="font-size:12px; color:#8e8e93; margin-top:10px; line-height:1.6;">
        지금 방송에 나가는 화면 그대로입니다. 소리는 나지 않고,
        재생 대기줄도 건드리지 않아 방송에 영향을 주지 않습니다.
      </div>`;
    screenFit();
}

// 방송 화면은 1080×1920 으로 만들어져 있다. 폰 너비에 맞춰 줄여서 보여준다.
function screenFit() {
    const wrap = $('screen-wrap'), f = $('screen-frame');
    if (!wrap || !f) return;
    const s = wrap.clientWidth / 1080;
    f.style.transform = 'scale(' + s + ')';
    wrap.style.height = Math.round(1920 * s) + 'px';
}
window.addEventListener('resize', () => { if (openedApp === 'screen') screenFit(); });

function screenReload() {
    const f = $('screen-frame');
    if (f) f.src = '/overlay?monitor=1&t=' + Date.now();
}

/* ═══ 📥 대기함 ═══ */
function rPending(el) {
    const pend = (gd?.pending_donations || []).slice();
    // 사람이 봐야 하는 것(모름)을 맨 위로 — 폰은 아래로 밀리면 사실상 안 보인다
    const rank = d => { const s = suggest[d.id];
        if (!s || !s.target) return 0; return s.tier === 'auto' ? 2 : 1; };
    pend.sort((a, b) => rank(a) - rank(b));
    if (!pend.length) {
        el.innerHTML = '<div class="empty"><b>✓ 대기 중인 후원이 없습니다</b><br>새 후원이 오면 위에서 알림이 내려옵니다</div>';
        return;
    }
    const list = players();
    el.innerHTML = pend.map(d => {
        const s = suggest[d.id];
        const need = !s || !s.target;
        const hist = ((s && s.history) || []).slice(0, 3);
        const btns = list.map(p =>
            `<button class="${s && s.target === p.name ? 'reco' : ''}"
                     onclick="assign('${d.id}','${esc(p.name)}')">${esc(p.name)}</button>`).join('')
            + `<button class="half" onclick="assignSplit('${d.id}','half')">반반</button>`

            + `<button class="half" style="color:var(--red)" onclick="removeDon('${d.id}')">삭제</button>`;
        const sug = s && s.target
            ? `<span class="sug ${s.tier === 'auto' ? 'auto' : 'mid'}">${s.tier === 'auto' ? '✓' : '🤖'} ${esc(s.target)}${s.why ? ' · ' + esc(s.why) : ''}</span>`
            : `<span class="sug unk">? 누구 것인지 모르겠음${s && s.why ? ' · ' + esc(s.why) : ''}</span>`;
        return `<div class="grp"><div class="cell don ${need ? 'need' : ''}">
            <div class="top"><span class="who">${esc(d.name)}</span><span class="amt">${won(d.amount)}원</span></div>
            ${d.message ? `<div class="msg">"${esc(d.message)}"</div>` : ''}
            ${sug}
            ${hist.length ? `<div class="hist">지난 배정 · ${hist.map(h => esc(h.name) + ' ' + h.count + '번').join(' · ')}</div>` : ''}
            <div class="as">${btns}</div>

    }).join('');
}

// 후원 한 건을 n 명에게 나눌 때 각자 받을 점수.
// ⚠️ 합이 '혼자 받았을 때'와 반드시 같아야 한다. 예전에는 폰과 조종실이 서로 다른 식을 써서,
//    같은 5만원이 혼자 받으면 5점, 조종실 반반은 6점, 폰 반반은 4점이 됐다.
//    조종실의 splitPoints() 와 같은 식이어야 한다 — 한쪽만 고치면 또 갈라진다.
function splitPoints(amount, n) {
    const total = Math.round((amount || 0) / 10000);
    const base = Math.floor(total / n), rest = total % n;
    return Array.from({ length: n }, (_, i) => base + (i < rest ? 1 : 0));
}

async function assignSplit(donId, mode) {
    if (busy) return;
    const don = (gd.pending_donations || []).find(d => d.id === donId);
    const list = players();
    if (!don || list.length < 2) return;
    const targets = mode === 'half' ? list.slice(0, 2) : list;
    const pts = splitPoints(don.amount, targets.length);
    if (!pts.some(p => p > 0)) { toast('나누기엔 금액이 너무 작습니다', false); return; }
    busy = true;
    try {
        const r = await addScore({ scope:'rank', pending_id:donId,
                         items: targets.map((t, i) => ({ name:t.name, delta:pts[i] })),
                         donor:don.name, donor_message:don.message });
        gd.pending_donations = gd.pending_donations.filter(d => d.id !== donId);
        renderApp(); renderHome();
        const 합 = pts.reduce((a, b) => a + b, 0);
        toast(r && r.already ? '이미 다른 기기에서 처리된 후원입니다'
                             : `${targets.length}명에게 나눠 ${합}점`, !(r && r.already));
    } catch (e) { toast('지급 실패', false); }
    finally { busy = false; }
}

/* ⚠️ 타이머는 match_data 를 통째로 patch 한다 — 점수(bjs)와 달리 이 객체는
      한 사람(운영자)만 만지는 값이라 마지막 저장이 이기면 된다. */
async function matchPatch(mut) {
    const md = JSON.parse(JSON.stringify(gd.match_data || {}));
    mut(md);
    try { await patch({ match_data: md }); }
    catch (e) { toast('실패: ' + e.message, false); }
}
function matchToggleActive() { matchPatch(md => { md.active = !md.active; }); }
function matchTimer(what) {
    matchPatch(md => {
        const now = Date.now() + serverOffset;
        if (what === 'toggle') {
            if (md.is_running) { md.time_left_ms = Math.max(0, (md.end_time_ms || 0) - now); md.is_running = false; }
            else { if ((md.time_left_ms || 0) <= 0) md.time_left_ms = md.paused_time_left || 180000;
                   md.end_time_ms = now + md.time_left_ms; md.is_running = true; }
            md.was_running_before_reaction = false;
        } else if (what === 'plus') {
            if (md.is_running) md.end_time_ms = (md.end_time_ms || now) + 60000;
            else md.time_left_ms = (md.time_left_ms || 0) + 60000;
        } else if (what === 'reset') {
            md.is_running = false; md.time_left_ms = 180000; md.paused_time_left = 180000;
        }
    });
}
setInterval(() => {   // 대결 시계는 초마다 — 열려 있을 때만, 숫자만

let verData = null;
function rVersion(el) {
    if (!verData) { el.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
    if (verData.err) { el.innerHTML = '<div class="empty">⚠ ' + esc(verData.err) + '</div>'; return; }
    const c = verData.current || {};
    el.innerHTML = `
      <div class="grp"><div class="cell">
        <div style="font-size:11px; color:var(--mut); font-weight:700">지금 돌고 있는 버전</div>
        <div style="margin-top:4px"><span class="num" style="color:var(--gold); font-size:20px; font-weight:900">${esc(c.label || '')}</span>
          <span style="font-size:14px; font-weight:700; margin-left:8px">${esc(c.subject || '')}</span></div>
        ${verData.pinned ? `<div style="font-size:12px; color:var(--gold); margin-top:7px">📌 고정됨 — 자동 배포 멈춤</div>
          <button class="btn b" style="width:100%; margin-top:9px" onclick="verLatest()">최신으로 돌아가기</button>` : ''}
      </div></div>
      <div class="grp">` + (verData.commits || []).map(v => {
        const now = v.sha === c.sha;
        return `<div class="cell row">
          <span class="num" style="color:${now ? 'var(--green)' : 'var(--gold)'}; font-weight:900; width:44px">${esc(v.label)}</span>
          <span style="flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(v.subject)}</span>
          ${now ? '<span style="font-size:11px; color:var(--green); font-weight:800">지금</span>'
                : `<button style="background:var(--card2); color:#fff; border-radius:8px; padding:7px 12px; font-size:11.5px; font-weight:700"
                     onclick="verSwitch('${v.sha}','${esc(v.label)}',${v.has_ui === false ? 'false' : 'true'})">이걸로</button>`}
        </div>`; }).join('') + '</div>';
}
async function loadVersions() {
    try {
        const res = await fetch('/api/version/list');
        verData = await res.json();
        if (!res.ok || verData.status !== 'success') verData = { err: verData.message || ('HTTP ' + res.status) };
    } catch (e) { verData = { err: '서버에 연결하지 못했습니다' }; }
    if (openedApp === 'version') rVersion($('sheet-body'));
}
async function verSwitch(sha, label, hasUi) {
    let msg = label + ' 로 되돌립니다.\n서버가 몇 초 껐다 켜집니다. 그 사이 후원은 사라지지 않습니다.';
    if (!hasUi) msg += '\n\n⚠️ 이 버전에는 버전 화면이 없어 폰에서 못 돌아옵니다!';
    if (!confirm(msg)) return;
    try {
        const d = await api('/api/version/switch', { sha });
        if (d.restarting) waitPatch();
    } catch (e) { toast('실패: ' + e.message, false); }
}
async function verLatest() {
    if (!confirm('최신 버전으로 돌아가고 자동 배포를 다시 켭니다.')) return;
    try { const d = await api('/api/version/latest'); if (d.restarting) waitPatch(); else toast(d.message); }
    catch (e) { toast('실패: ' + e.message, false); }
}
async function waitPatch() {
    $('patchveil').classList.add('on');
    for (let i = 0; i < 90; i++) {
        await new Promise(r => setTimeout(r, 1000));
        try { const r = await fetch('/api/ping', { cache:'no-store' });
              if (r.ok) { await new Promise(r2 => setTimeout(r2, 1000)); location.reload(); return; } }
        catch (e) {}
    }
    $('patchveil').classList.remove('on');
    toast('서버가 돌아오지 않습니다 — 상태를 확인해주세요', false);
}

/* ═══ 🩺 상태 ═══ */
let healthData = null;
function rHealth(el) {
    if (!healthData) { el.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
    const h = healthData;
    const age = h.last_donation_age_sec;
    const rows = [
        ['서버', h.status === 'ok' ? '정상' : String(h.status)],
        ['마지막 후원', age == null ? '없음' : (age < 60 ? age + '초 전' : Math.floor(age / 60) + '분 전')],
        ['보고 있는 화면', (h.sse_clients || 0) + '대'],
        ['대기함', ((h.counts || {}).pending || 0) + '건'],
        ['재생 대기', ((h.counts || {}).reaction_queue || 0) + '건'],
        ['저장소', (h.storage || {}).ok ? ((h.storage || {}).kind + ' 정상') : '⚠ 문제'],
        ['켜진 지', Math.floor((h.uptime_sec || 0) / 60) + '분'],
    ];
    el.innerHTML = '<div class="grp">' + rows.map(r =>
        `<div class="cell row"><span style="flex:1; font-size:14px; color:var(--mut)">${r[0]}</span>
         <span class="num" style="font-size:14px; font-weight:700">${esc(String(r[1]))}</span></div>`).join('') + '</div>';
}
async function loadHealth() {
    try { healthData = await (await fetch('/api/health')).json(); } catch (e) { healthData = { status:'연결 안 됨' }; }
    if (openedApp === 'health') rHealth($('sheet-body'));
}

/* ═══ 🔔 알림 배너 — 위에서 내려온다 ═══ */
function banner(icon, title, sub, iconBg, onTap, ms) {
    const b = document.createElement('div');
    b.className = 'banner';
    b.innerHTML = `<span class="bi" style="background:${iconBg || 'var(--card2)'}">${icon}</span>
                   <span class="bt"><b>${title}</b><span>${sub || ''}</span></span>`;
    b.onclick = () => { dismiss(); if (onTap) onTap(); };
    const wrap = $('banners');
    wrap.prepend(b);
    while (wrap.children.length > 3) wrap.lastChild.remove();
    requestAnimationFrame(() => b.classList.add('in'));
    let t = setTimeout(dismiss, ms || 4500);
    function dismiss() { clearTimeout(t); b.classList.add('out'); setTimeout(() => b.remove(), 350); }
}

/* ═══ 오토파일럿 판정 물어보기 ═══ */
async function queueAudits() {
    if (!gd) return;
    const names = players().map(p => p.name);
    for (const don of (gd.pending_donations || [])) {
        if (asked.has(don.id)) continue;
        asked.add(don.id);
        try {
            const res = await api('/api/audit/suggest',
                { name:don.name, amount:don.amount, message:don.message || '', players:names });
            if (res && res.status === 'success') { suggest[don.id] = res; renderApp(); }
        } catch (e) { asked.delete(don.id); }
    }
}

/* ═══ SSE ═══ */
function handleState(st) {
    if (st.server_time) serverOffset = st.server_time - Date.now();
    const prev = gd; gd = st;
    // 새 후원 알림 — 처음 받은 상태는 '이미 있던 것'이라 울리지 않는다
    for (const d of (st.pending_donations || [])) {
        if (!seenDon.has(d.id)) {
            seenDon.add(d.id);
            if (!firstState) banner('💰', `${d.name} · ${won(d.amount)}원`,
                d.message || '(메시지 없음)', 'linear-gradient(135deg,#b8860b,#8a6508)',
                () => openApp('pending'));
        }
    }
    firstState = false;
    renderHome(); renderApp(); queueAudits();
    $('sb-ver').textContent = '';
}
function connectSSE() {
    const es = new EventSource('/api/stream' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : ''));
    es.onopen = () => { $('sb-dot').classList.remove('off'); $('sb-txt').textContent = '연결됨'; };
    const on = e => { try { handleState(JSON.parse(e.data)); } catch (err) {} };
    es.addEventListener('init', on);
    es.addEventListener('update', on);
    es.onerror = () => {
        $('sb-dot').classList.add('off'); $('sb-txt').textContent = '재연결 중…';
        es.close(); setTimeout(connectSSE, 1500);
    };
}
connectSSE();
setInterval(() => {
    const d = new Date(Date.now() + serverOffset);
    $('sb-time').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}, 1000);
renderHome();
</script>

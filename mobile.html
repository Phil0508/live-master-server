<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>📱 모바일 조종실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
/* 자리 비웠을 때 한 손으로 쓰는 화면이다.
   목적은 딱 둘 — '대기함 후원을 배정한다', '점수를 고친다'.
   그 외 기능은 일부러 넣지 않았다. 폰에서 컨트롤러를 다 재현하면 결국 똑같이 불편해진다. */
:root {
    --bg: #0e0f12; --panel: #17191e; --panel-2: #1e2127;
    --line: #2b2f37; --text: #eceef2; --muted: #8b909a; --dim: #6f7480;
    --accent: #4a9eff; --gold: #d9a441; --danger: #ff453a; --success: #34c759;
    --r1: 8px; --r2: 14px; --r3: 20px;
    --ease: cubic-bezier(0.4,0,0.2,1); --ease-out: cubic-bezier(0.16,1,0.3,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
    letter-spacing: -0.3px;
    padding: 0 12px calc(28px + env(safe-area-inset-bottom));
}
button { font-family: inherit; border: none; cursor: pointer; transition: transform 120ms var(--ease), background 200ms var(--ease); }
button:active { transform: scale(0.96); }

/* ── 상단 상태바 ── */
header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(14,15,18,0.94); backdrop-filter: blur(16px);
    margin: 0 -12px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
}
header h1 { margin: 0; font-size: 16px; font-weight: 800; flex: 1; }
#conn { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
        background: rgba(52,199,89,0.14); color: var(--success); white-space: nowrap; }
#conn.bad { background: rgba(255,69,58,0.14); color: var(--danger); }

/* ── 섹션 ── */
.sec { margin-top: 18px; }
.sec-title { font-size: 12px; font-weight: 800; color: var(--muted); margin: 0 4px 8px;
             display: flex; align-items: center; gap: 8px; }
.count { background: var(--gold); color: #000; font-size: 11px; font-weight: 900;
         padding: 1px 8px; border-radius: 999px; }

/* ── 대기함 카드 ── */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2);
        padding: 14px; margin-bottom: 12px; animation: pop 320ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.card .who { font-size: 15px; font-weight: 800; }
.card .amt { color: var(--gold); font-weight: 900; font-variant-numeric: tabular-nums; }
.card .msg { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.45;
             word-break: break-word; }
.sug { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 800;
       color: #8fd1ff; background: rgba(0,150,255,0.12);
       border: 1px solid rgba(0,150,255,0.35); padding: 3px 9px; border-radius: 999px; }
.pay { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
/* 터치 목표를 크게 — 밖에서 급하게 누른다 */
.pay button { min-height: 46px; flex: 1 1 30%; border-radius: var(--r1);
              background: var(--panel-2); color: var(--text);
              font-size: 14px; font-weight: 800; border: 1px solid var(--line); }
.pay button.reco { background: rgba(74,158,255,0.16); border-color: var(--accent); color: #cfe4ff; }
.pay .sub { flex: 1 1 100%; display: flex; gap: 8px; }
.pay .sub button { flex: 1; min-height: 40px; font-size: 13px; font-weight: 700; color: var(--muted); }
.pay .sub button.del { color: var(--danger); }

/* ── 점수판 ── */
.prow { display: flex; align-items: center; gap: 10px; background: var(--panel);
        border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 12px; margin-bottom: 8px; }
.prow .nm { flex: 1; font-size: 15px; font-weight: 700; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sc { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums;
            min-width: 56px; text-align: right; }
.prow button { width: 44px; height: 44px; border-radius: 50%; background: var(--panel-2);
               color: var(--text); font-size: 20px; font-weight: 800; border: 1px solid var(--line); }
.prow button.plus { color: var(--success); }
.prow button.minus { color: var(--danger); }

.empty { color: var(--dim); font-size: 13px; text-align: center; padding: 26px 0; }

/* ── 되돌리기 토스트 ── */
#undo { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
        background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r2);
        padding: 12px 14px; display: none; align-items: center; gap: 12px; z-index: 100;
        box-shadow: 0 12px 34px rgba(0,0,0,0.55); animation: pop 240ms var(--ease-out); }
#undo span { flex: 1; font-size: 13px; font-weight: 700; }
#undo button { background: var(--accent); color: #fff; font-weight: 900; font-size: 13px;
               padding: 9px 16px; border-radius: var(--r1); }
/* 실패 알림 */
#err { position: fixed; left: 12px; right: 12px; top: calc(64px + env(safe-area-inset-top));
       background: rgba(255,69,58,0.95); color: #fff; border-radius: var(--r2);
       padding: 12px 14px; font-size: 13px; font-weight: 700; display: none; z-index: 200;
       box-shadow: 0 12px 34px rgba(0,0,0,0.5); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
    <h1>📱 모바일 조종실</h1>
    <span id="conn" class="bad">연결 중…</span>
</header>

<div class="sec">
    <div class="sec-title">후원 대기함 <span class="count" id="pcount">0</span></div>
    <div id="pending"><div class="empty">불러오는 중…</div></div>
</div>

<div class="sec">
    <div class="sec-title">점수</div>
    <div id="players"></div>
</div>

<div id="undo"><span id="undo-text"></span><button onclick="undoLast()">되돌리기</button></div>
<div id="err"></div>

<script>
// 이 화면은 '자리 비웠을 때' 쓰는 물건이다. 밖에서는 네트워크가 불안정하므로
// 어떤 조작이든 (1) 실패를 반드시 눈에 보이게 알리고 (2) 실패하면 화면을 원래대로 되돌린다.
let gd = null;
let busy = false;              // 조작 한 건이 끝나기 전에 다음 조작을 받지 않는다(중복 지급 방지)
let lastAction = null;         // 되돌리기용
let undoTimer = null;
const suggest = {};            // don.id -> {target, confidence}
const asked = new Set();       // AI 추천을 이미 물어본 후원
const SUG_MIN = 0.6;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => (n || 0).toLocaleString();

function showErr(msg) {
    const e = $('err');
    e.textContent = '⚠️ ' + msg;
    e.style.display = 'block';
    clearTimeout(showErr._t);
    showErr._t = setTimeout(() => { e.style.display = 'none'; }, 4000);
}

function players() {
    if (!gd) return [];
    return (gd.extra_game_active ? gd.extra_bjs : gd.bjs) || [];
}

// ── 서버 전송 ─────────────────────────────────────────────
// 점수는 '더할 값'만 보낸다. 상태 전체를 보내면, PC 조종실(오토파일럿 포함)이 같은 순간에
// 점수를 주고 있을 때 나중에 도착한 쪽이 앞선 점수를 통째로 덮어써서 한쪽이 사라졌다.
// 위험 구간은 SSE 전파 지연만큼인데 실측이 약 0.5초라 밖에서 누르다 보면 충분히 부딪힌다.
// pending_id 를 같이 보내면 '점수 지급'과 '대기함에서 제거'가 서버의 같은 잠금 안에서 끝나
// 그 사이에 실패해 후원이 어디에도 없는 상태가 되는 일도 없다.
async function addScore(payload) {
    const res = await fetch('/api/score/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        try { msg = (await res.json()).message || msg; } catch (e) {}
        throw new Error(msg);
    }
    return res.json();
}

// ── 배정 ──────────────────────────────────────────────────
// ⚠️ 반드시 '이름'으로 사람을 찾는다. 목록은 기여도순으로 계속 재정렬되므로
//    인덱스를 들고 있으면 엉뚱한 사람에게 점수가 들어간다.
async function assign(donId, name) {
    if (busy) return;
    const don = (gd.pending_donations || []).find(d => d.id === donId);
    const p = players().find(b => b.name === name);
    if (!don || !p) return;
    busy = true;

    const pts = Math.round((don.amount || 0) / 10000);
    // 화면만 먼저 움직여 손맛을 준다. 서버 응답이 오면 SSE 가 진짜 값으로 맞춰준다.
    const before = { score: p.score || 0, contribution: p.contribution || 0 };
    p.score = before.score + pts;
    p.contribution = before.contribution + pts;
    gd.pending_donations = gd.pending_donations.filter(d => d.id !== donId);
    render();

    try {
        const r = await addScore({ scope: 'rank', name, delta: pts, pending_id: donId });
        rememberUndo(`${don.name}님 → ${name} +${pts}점`,
                     { type: 'assign', name, pts, logTime: r.time });
    } catch (e) {
        // 서버에 아무것도 안 들어갔다. 화면을 원래대로 되돌리고 다시 누를 수 있게 카드를 살린다.
        p.score = before.score; p.contribution = before.contribution;
        gd.pending_donations.unshift(don);
        render();
        showErr('지급하지 못했습니다. 다시 눌러주세요.');
    } finally { busy = false; }
}

async function assignSplit(donId, mode) {
    if (busy) return;
    const don = (gd.pending_donations || []).find(d => d.id === donId);
    const list = players();
    if (!don || list.length < 2) return;
    const targets = mode === 'half' ? list.slice(0, 2) : list;
    busy = true;
    const pts = Math.floor(Math.round((don.amount || 0) / 10000) / targets.length);
    if (pts <= 0) { busy = false; showErr('나누기엔 금액이 너무 작습니다.'); return; }

    const names = targets.map(t => t.name);
    const before = targets.map(p => ({ p, s: p.score || 0, c: p.contribution || 0 }));
    targets.forEach(p => { p.score = (p.score || 0) + pts; p.contribution = (p.contribution || 0) + pts; });
    gd.pending_donations = gd.pending_donations.filter(d => d.id !== donId);
    render();
    try {
        // 여러 명을 한 요청으로 보낸다. 서버는 한 명이라도 못 찾으면 아무것도 반영하지 않으므로
        // '절반만 들어간' 상태가 생기지 않는다.
        const r = await addScore({ scope: 'rank', pending_id: donId,
                                   items: names.map(n => ({ name: n, delta: pts })) });
        rememberUndo(`${don.name}님 → ${targets.length}명 각 +${pts}점`,
                     { type: 'split', targets: names, pts, logTime: r.time });
    } catch (e) {
        before.forEach(b => { b.p.score = b.s; b.p.contribution = b.c; });
        gd.pending_donations.unshift(don);
        render();
        showErr('나눠주지 못했습니다. 다시 눌러주세요.');
    } finally { busy = false; }
}

async function ignore(donId) {
    if (busy) return;
    const don = (gd.pending_donations || []).find(d => d.id === donId);
    if (!don) return;
    if (!confirm(`${don.name}님 ${won(don.amount)}원 후원을 무시할까요?\n(점수는 아무에게도 안 갑니다)`)) return;
    busy = true;
    gd.pending_donations = gd.pending_donations.filter(d => d.id !== donId);
    render();
    try {
        const r = await fetch('/api/pending/remove/' + encodeURIComponent(donId), { method: 'POST' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
    } catch (e) {
        gd.pending_donations.unshift(don); render();
        showErr('무시하지 못했습니다.');
    } finally { busy = false; }
}

// ── 점수 직접 수정 ────────────────────────────────────────
async function bump(name, delta) {
    if (busy) return;
    const p = players().find(b => b.name === name);
    if (!p) return;
    busy = true;
    const before = { s: p.score || 0, c: p.contribution || 0 };
    p.score = before.s + delta;
    p.contribution = before.c + delta;
    render();
    try {
        const r = await addScore({ scope: 'rank', name, delta });
        rememberUndo(`${name} ${delta > 0 ? '+' : ''}${delta}점`,
                     { type: 'bump', name, delta, logTime: r.time });
    } catch (e) {
        p.score = before.s; p.contribution = before.c; render();
        showErr('점수를 바꾸지 못했습니다.');
    } finally { busy = false; }
}

// ── 되돌리기 ──────────────────────────────────────────────
// 밖에서 급하게 누르다 보면 오타가 난다. 마지막 한 건은 항상 되돌릴 수 있어야 한다.
function rememberUndo(label, action) {
    lastAction = action;
    $('undo-text').textContent = label;
    $('undo').style.display = 'flex';
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { $('undo').style.display = 'none'; lastAction = null; }, 8000);
}

async function undoLast() {
    if (!lastAction || busy) return;
    const a = lastAction;
    lastAction = null;
    $('undo').style.display = 'none';
    busy = true;
    // 되돌리기도 '더할 값'으로 보낸다(부호만 반대). 그래야 그 사이 다른 데서 들어온 점수를 지우지 않는다.
    // 원래 남긴 로그 줄은 undo_log 로 지워서 장부에 '+3'과 '-3'이 나란히 남지 않게 한다.
    const items = (a.type === 'split')
        ? a.targets.map(n => ({ name: n, delta: -a.pts }))
        : [{ name: a.name, delta: -(a.type === 'assign' ? a.pts : a.delta) }];
    try {
        items.forEach(it => {
            const p = players().find(b => b.name === it.name);
            if (p) { p.score = (p.score || 0) + it.delta; p.contribution = (p.contribution || 0) + it.delta; }
        });
        render();
        await addScore({
            scope: 'rank', items, log: false,
            undo_log: a.logTime ? items.map(it => ({ time: a.logTime, name: it.name, val: -it.delta })) : null,
        });
    } catch (e) {
        showErr('되돌리지 못했습니다.');
    } finally { busy = false; }
}

// ── AI 추천 (있으면 배지로만 보여준다. 자동으로 배정하지 않는다) ──
function askSuggest(don) {
    if (asked.has(don.id) || !don.message) return;
    asked.add(don.id);
    fetch('/api/audit/suggest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: don.name, amount: don.amount, message: don.message,
                               players: players().map(p => p.name) })
    }).then(r => r.json()).then(res => {
        if (res && res.target && (res.confidence || 0) >= SUG_MIN) {
            suggest[don.id] = res;
            render();
        }
    }).catch(() => {});   // AI 가 없어도 화면은 그대로 동작해야 한다
}

// ── 그리기 ────────────────────────────────────────────────
function render() {
    if (!gd) return;
    const list = players();
    const pend = (gd.pending_donations || []).filter(d => d.type !== 'off_work');
    $('pcount').textContent = pend.length;

    $('pending').innerHTML = pend.length ? pend.map(d => {
        const s = suggest[d.id];
        const btns = list.map(p =>
            `<button class="${s && s.target === p.name ? 'reco' : ''}"
                     onclick="assign('${d.id}','${esc(p.name).replace(/'/g, '&#39;')}')">${esc(p.name)}</button>`
        ).join('');
        return `<div class="card">
            <div><span class="who">${esc(d.name)}</span> · <span class="amt">${won(d.amount)}원</span></div>
            ${d.message ? `<div class="msg">"${esc(d.message)}"</div>` : ''}
            ${s ? `<div class="sug">🤖 ${esc(s.target)}로 보임</div>` : ''}
            <div class="pay">${btns}
                <div class="sub">
                    <button onclick="assignSplit('${d.id}','half')">🌓 반반</button>
                    <button onclick="assignSplit('${d.id}','n')">🔢 N분할</button>
                    <button class="del" onclick="ignore('${d.id}')">무시</button>
                </div>
            </div>
        </div>`;
    }).join('') : '<div class="empty">대기 중인 후원이 없습니다</div>';

    $('players').innerHTML = list.length ? list.map(p => `<div class="prow">
        <div class="nm">${esc(p.name)}</div>
        <div class="sc">${won(p.score)}</div>
        <button class="minus" onclick="bump('${esc(p.name).replace(/'/g, '&#39;')}',-1)">−</button>
        <button class="plus"  onclick="bump('${esc(p.name).replace(/'/g, '&#39;')}',1)">+</button>
    </div>`).join('') : '<div class="empty">플레이어가 없습니다</div>';

    pend.forEach(askSuggest);
}

// ── 서버 연결 ─────────────────────────────────────────────
let es = null, lastMsg = Date.now();
function connect() {
    if (es) es.close();
    es = new EventSource('/api/stream');
    const onState = e => {
        lastMsg = Date.now();
        try {
            const d = JSON.parse(e.data);
            // 내가 조작하는 중에 들어온 갱신으로 화면이 튀지 않게 한다.
            // (조작이 끝나면 다음 갱신에서 어차피 맞춰진다)
            if (busy) return;
            gd = d;
            render();
        } catch (err) {}
        $('conn').textContent = '연결됨';
        $('conn').className = '';
    };
    es.addEventListener('init', onState);     // ⚠️ 서버는 이름 붙은 이벤트로 보낸다. onmessage 로는 못 받는다.
    es.addEventListener('update', onState);
    es.addEventListener('ping', () => { lastMsg = Date.now(); });
    es.onerror = () => {
        $('conn').textContent = '재연결 중…';
        $('conn').className = 'bad';
        es.close();
        setTimeout(connect, 3000);
    };
}
// 연결이 조용히 죽는 경우(프록시가 끊었는데 onerror 가 안 뜨는 상황) 대비
setInterval(() => {
    if (Date.now() - lastMsg > 45000) { lastMsg = Date.now(); connect(); }
}, 10000);

connect();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 시그니처 위젯 전용 오버레이</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Pretendard', sans-serif;
            color-scheme: only light;
        }

        /* 🎵 리액션 음원/사진 송출 화면 오버레이 스타일 (overlay.html 원본 동일) */
        .reaction-screen-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 550px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100010;
            padding: 0;
            box-sizing: border-box;
        }

        .reaction-screen-overlay.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .reaction-screen-overlay img {
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .reaction-text-donator {
            margin-top: 20px;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 4px 20px rgba(0,0,0,0.9);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .reaction-text-message {
            margin-top: 15px;
            font-size: 30px;
            font-weight: 700;
            color: #00ffcc;
            text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 0 15px rgba(0,255,204,0.6);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            word-break: break-all;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- 🎵 시그니처 위젯 레이어 (overlay.html 구조 100% 동일) -->
    <div id="reaction-screen-overlay" class="reaction-screen-overlay">
        <img id="reaction-screen-image" src="" alt="Reaction Image">
        <div id="reaction-donator-info" class="reaction-text-donator"></div>
        <div id="reaction-message-info" class="reaction-text-message"></div>
    </div>

    <!-- 🎵 시그니처 오디오 객체 -->
    <audio id="reaction-audio" style="display:none;"></audio>

    <script>
        let reactionTimeout = null;
        let reactionImgClearTimeout = null;
        let audioSafetyTimeout = null;

        function formatNum(n) {
            return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function stopReactionVisuals() {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            if (overlay) {
                overlay.classList.remove('show');
            }
            if (reactionImgClearTimeout) clearTimeout(reactionImgClearTimeout);
            reactionImgClearTimeout = setTimeout(() => {
                if (img) img.src = "";
            }, 500);
        }

        function playReaction(data) {
            console.log('Playing reaction:', data);
            
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const donatorEl = document.getElementById('reaction-donator-info');
            const messageEl = document.getElementById('reaction-message-info');
            const audio = document.getElementById('reaction-audio');
            
            if (!overlay || !img || !audio) return;
            
            if (reactionTimeout) clearTimeout(reactionTimeout);
            if (reactionImgClearTimeout) { clearTimeout(reactionImgClearTimeout); reactionImgClearTimeout = null; }
            if (audioSafetyTimeout) { clearTimeout(audioSafetyTimeout); audioSafetyTimeout = null; }

            audio.onended = null;
            audio.onerror = null;
            audio.onloadedmetadata = null;
            audio.pause();
            audio.src = '';

            let donatorName = data.donator || '익명';
            let donationAmount = data.amount ? formatNum(data.amount) + '원' : '';
            
            if (donatorEl) {
                donatorEl.innerText = donatorName + (donationAmount ? ' · ' + donationAmount : '');
            }

            let msgText = data.message || '';
            if (messageEl) {
                if (msgText && msgText !== '수동 후원 송출') {
                    messageEl.innerText = msgText;
                    messageEl.style.display = 'block';
                } else {
                    messageEl.innerText = '';
                    messageEl.style.display = 'none';
                }
            }

            let soundUrl = data.sound_url || (data.sound_file ? `/media/sounds/${data.sound_file}` : null);
            let imgUrl = data.image_url || (data.image_file ? `/media/images/${data.image_file}` : null);

            if (imgUrl) {
                img.src = imgUrl;
                img.style.display = 'block';
            } else {
                img.src = '';
                img.style.display = 'none';
            }

            overlay.classList.add('show');

            let reactionDurationMs = 10000;
            if (data.duration && !isNaN(data.duration) && data.duration > 0) {
                reactionDurationMs = data.duration * 1000;
            }

            const finishReaction = () => {
                if (reactionTimeout) clearTimeout(reactionTimeout);
                if (audioSafetyTimeout) clearTimeout(audioSafetyTimeout);
                audio.pause();
                stopReactionVisuals();
            };

            if (soundUrl) {
                audio.src = soundUrl;
                audio.currentTime = 0;

                audio.onloadedmetadata = () => {
                    if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                        reactionDurationMs = (audio.duration + 0.3) * 1000;
                        if (reactionTimeout) clearTimeout(reactionTimeout);
                        reactionTimeout = setTimeout(finishReaction, reactionDurationMs);
                    }
                };

                audio.onended = finishReaction;
                audio.onerror = finishReaction;

                audio.play().catch(err => {
                    console.log("Autoplay error:", err);
                    reactionTimeout = setTimeout(finishReaction, reactionDurationMs);
                });

                audioSafetyTimeout = setTimeout(finishReaction, reactionDurationMs + 2000);
            } else {
                reactionTimeout = setTimeout(finishReaction, reactionDurationMs);
            }
        }

        // 📡 SSE 실시간 연동
        function initSSE() {
            const evtSource = new EventSource('/api/stream');

            ['signature', 'donation', 'test_reaction', 'slot_spin'].forEach(evtName => {
                evtSource.addEventListener(evtName, (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        console.log(`[SSE] ${evtName}:`, data);
                        playReaction(data);
                    } catch (err) {
                        console.error('SSE Error:', err);
                    }
                });
            });

            evtSource.onerror = () => {
                setTimeout(initSSE, 3000);
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSSE();
        });
    </script>
</body>
</html>

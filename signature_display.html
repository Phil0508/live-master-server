<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 시그니처 위젯 전용 오버레이 (시각 전용)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c12;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #ffffff;
            color-scheme: only dark;
        }

        /* OBS 투명 모드 지원 (?transparent=1) */
        body.transparent-mode {
            background-color: transparent !important;
        }

        /* 🎵 overlay.html 원본 시그니처 위젯 CSS (기본 20초 100% 화면 유지) */
        .reaction-screen-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 640px;
            /* 🎬 반투명 레터박스 (원래 전광판 위젯 톤: 어두운 유리 + 골드 상하 엣지) */
            background: linear-gradient(180deg, rgba(18,18,26,0.82), rgba(10,10,16,0.88));
            border-top: 2px solid rgba(246,196,83,0.45);
            border-bottom: 2px solid rgba(246,196,83,0.45);
            border-radius: 20px;
            box-shadow: 0 12px 44px rgba(0,0,0,0.6);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100010;
            padding: 30px 34px 26px;
            box-sizing: border-box;
        }

        .reaction-screen-overlay.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .reaction-screen-overlay img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 25px rgba(0, 255, 204, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .reaction-text-donator {
            margin-top: 24px;
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 4px 20px rgba(0,0,0,0.9);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .reaction-text-message {
            margin-top: 14px;
            font-size: 32px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 0 18px rgba(0,255,204,0.7);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            word-break: break-all;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- 🎵 시그니처 위젯 레이어 (시각 화면 전용 - 소리 없음) -->
    <div id="reaction-screen-overlay" class="reaction-screen-overlay">
        <img id="reaction-screen-image" src="" alt="시그니처 사진">
        <div id="reaction-donator-info" class="reaction-text-donator"></div>
        <div id="reaction-message-info" class="reaction-text-message"></div>
    </div>

    <script>
        let globalData = null;
        let reactionImgClearTimeout = null;
        let currentReactionId = null;   // 지금 화면에 띄운 시그니처 id (오버레이의 currentPlayingId 미러)

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('transparent') === '1') {
            document.body.classList.add('transparent-mode');
        }

        function formatNum(n) {
            return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function stopReactionVisuals() {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');

            if (overlay) {
                overlay.classList.remove('show');
            }
            if (reactionImgClearTimeout) clearTimeout(reactionImgClearTimeout);
            reactionImgClearTimeout = setTimeout(() => {
                if (img) img.src = "";
            }, 600);
        }

        function playReaction(data) {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const donatorEl = document.getElementById('reaction-donator-info');
            const messageEl = document.getElementById('reaction-message-info');
            if (!overlay || !img || !data) return;

            if (reactionImgClearTimeout) { clearTimeout(reactionImgClearTimeout); reactionImgClearTimeout = null; }

            // 후원자 이름 + 금액 (예: 홍길동 · 10,300원)
            const donatorName = data.donator || data.nickname || '익명';
            const donationAmount = data.amount ? formatNum(data.amount) + '원' : '';
            if (donatorEl) donatorEl.innerText = donatorName + (donationAmount ? ' · ' + donationAmount : '');

            // 후원 메시지(없으면 시그니처 제목)
            const msgText = data.message || data.title || '';
            if (messageEl) {
                const show = !!(msgText && msgText !== '수동 후원 송출');
                messageEl.innerText = show ? msgText : (data.title || '');
                messageEl.style.display = (show || data.title) ? 'block' : 'none';
            }

            // 시그니처 사진 (없거나 로드 실패 시 money.png 로 폴백)
            img.onerror = () => { img.onerror = null; img.src = '/money.png'; };
            img.src = data.image_url || '/money.png';
            img.style.display = 'block';

            overlay.classList.add('show');
        }

        // 오버레이의 checkReactionQueue 와 동일한 미러 로직:
        //  - reaction_queue[0] 이 '지금 재생 중'인 시그니처. id가 바뀔 때만 새로 띄운다.
        //  - 큐가 비거나 reaction_mode 가 꺼지면 즉시 내린다.
        //  - 독립 타이머가 없다 = 방송 오버레이가 내리는 그 순간 같이 내려가 정확히 동기화된다.
        function handleData(d) {
            if (!d) return;
            globalData = d;
            const reac = (d.reaction_mode && d.reaction_queue && d.reaction_queue.length > 0)
                ? d.reaction_queue[0] : null;
            if (!reac) {
                if (currentReactionId !== null) { currentReactionId = null; stopReactionVisuals(); }
                return;
            }
            if (currentReactionId !== reac.id) {   // 같은 시그니처면 재호출 무시(타이머 리셋/깜빡임 방지)
                currentReactionId = reac.id;
                playReaction(reac);
            }
        }

        // 📡 SSE 실시간 상태 수신 — 오버레이와 같은 'update' 스트림을 그대로 따라간다.
        // (서버는 donation/test_reaction/signature 이벤트를 쏘지 않으므로 그 리스너들은 제거했다.
        //  슬롯 당첨도 reaction_queue 에 실려 'update' 로 오므로 큐 경로가 알아서 처리한다.)
        function initSSE() {
            const evtSource = new EventSource('/api/stream');
            const onState = (e) => { try { handleData(JSON.parse(e.data)); } catch (err) {} };
            evtSource.onmessage = onState;
            evtSource.addEventListener('init', onState);    // 연결 즉시 현재 상태 수신(늦게 켜도 지금 시그니처 표시)
            evtSource.addEventListener('update', onState);
            // 긴급중단/스킵: 지금 띄운 시그니처가 중단 대상이면 즉시 내린다(뒤이어 오는 update 와도 일치).
            evtSource.addEventListener('reaction_stop', (e) => {
                try { const data = JSON.parse(e.data); if (data && data.id && data.id !== currentReactionId) return; } catch (err) {}
                currentReactionId = null;
                stopReactionVisuals();
            });
            evtSource.onerror = () => { /* EventSource 가 자동으로 재연결한다 */ };
        }

        document.addEventListener('DOMContentLoaded', initSSE);
    </script>
</body>
</html>

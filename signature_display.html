<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 시그니처 위젯 전용 오버레이</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c12;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #ffffff;
            color-scheme: only dark;
        }

        /* OBS 투명 모드 지원 (?transparent=1) */
        body.transparent-mode {
            background-color: transparent !important;
        }

        /* 😴 대기 화면 안내 (Idle State) */
        #idle-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #idle-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .idle-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        .idle-title {
            font-size: 26px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 🎵 리액션 음원/사진 송출 화면 오버레이 스타일 (overlay.html 원본 동일) */
        .reaction-screen-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 600px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100010;
            padding: 0;
            box-sizing: border-box;
        }

        .reaction-screen-overlay.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 1. 시그니처 사진 이미지 */
        .reaction-screen-overlay img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px rgba(0, 255, 204, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* 2. 후원자 이름 + 후원 금액 */
        .reaction-text-donator {
            margin-top: 24px;
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 4px 20px rgba(0,0,0,0.9);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* 3. 후원 메시지 (시그니처 제목) */
        .reaction-text-message {
            margin-top: 14px;
            font-size: 32px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 0 18px rgba(0,255,204,0.7);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            word-break: break-all;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- 😴 대기 상태 안내 -->
    <div id="idle-container">
        <div class="idle-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">시그니처 서버 연결됨</span>
        </div>
        <div class="idle-title">📺 시그니처 송출 대기 중...</div>
    </div>

    <!-- 🎵 시그니처 위젯 레이어 (사진, 후원자+금액, 메시지 3가지 전용) -->
    <div id="reaction-screen-overlay" class="reaction-screen-overlay">
        <!-- 1. 시그니처 사진 -->
        <img id="reaction-screen-image" src="" alt="시그니처 사진">
        
        <!-- 2. 후원자 및 후원 금액 -->
        <div id="reaction-donator-info" class="reaction-text-donator"></div>
        
        <!-- 3. 후원 메시지 -->
        <div id="reaction-message-info" class="reaction-text-message"></div>
    </div>

    <!-- 🎵 시그니처 오디오 객체 -->
    <audio id="reaction-audio" style="display:none;"></audio>

    <script>
        let reactionTimeout = null;
        let reactionImgClearTimeout = null;
        let audioSafetyTimeout = null;

        // URL 쿼리에 ?transparent=1 파라미터가 있으면 투명 배경 모드 활성화
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('transparent') === '1') {
            document.body.classList.add('transparent-mode');
        }

        function formatNum(n) {
            return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function stopReactionVisuals() {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const idleContainer = document.getElementById('idle-container');

            if (overlay) {
                overlay.classList.remove('show');
            }
            if (reactionImgClearTimeout) clearTimeout(reactionImgClearTimeout);
            reactionImgClearTimeout = setTimeout(() => {
                if (img) img.src = "";
                if (idleContainer) idleContainer.classList.remove('hidden');
            }, 500);
        }

        function playReaction(data) {
            console.log('Playing reaction:', data);
            
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const donatorEl = document.getElementById('reaction-donator-info');
            const messageEl = document.getElementById('reaction-message-info');
            const audio = document.getElementById('reaction-audio');
            const idleContainer = document.getElementById('idle-container');
            
            if (!overlay || !img || !audio) return;
            
            if (reactionTimeout) clearTimeout(reactionTimeout);
            if (reactionImgClearTimeout) { clearTimeout(reactionImgClearTimeout); reactionImgClearTimeout = null; }
            if (audioSafetyTimeout) { clearTimeout(audioSafetyTimeout); audioSafetyTimeout = null; }

            audio.onended = null;
            audio.onerror = null;
            audio.onloadedmetadata = null;
            audio.pause();
            audio.src = '';

            // 대기 안내 숨기기
            if (idleContainer) idleContainer.classList.add('hidden');

            // 1. 후원자 이름 + 금액 (예: 홍길동 · 10,300원)
            let donatorName = data.donator || data.nickname || '익명';
            let donationAmount = data.amount ? formatNum(data.amount) + '원' : '';
            
            if (donatorEl) {
                donatorEl.innerText = donatorName + (donationAmount ? ' · ' + donationAmount : '');
            }

            // 2. 후원 메시지 또는 시그니처 제목
            let msgText = data.message || data.title || '';
            if (messageEl) {
                if (msgText && msgText !== '수동 후원 송출') {
                    messageEl.innerText = msgText;
                    messageEl.style.display = 'block';
                } else if (data.title) {
                    messageEl.innerText = data.title;
                    messageEl.style.display = 'block';
                } else {
                    messageEl.innerText = '';
                    messageEl.style.display = 'none';
                }
            }

            // 3. 시그니처 사진 이미지
            let soundUrl = data.sound_url || (data.sound_file ? `/media/sounds/${data.sound_file}` : null);
            let imgUrl = data.image_url || (data.image_file ? `/media/images/${data.image_file}` : '/money.png');

            if (imgUrl) {
                img.src = imgUrl;
                img.style.display = 'block';
            } else {
                img.src = '/money.png';
                img.style.display = 'block';
            }

            // 화면에 띄우기 (Show)
            overlay.classList.add('show');

            let reactionDurationMs = 10000;
            if (data.duration && !isNaN(data.duration) && data.duration > 0) {
                reactionDurationMs = data.duration * 1000;
            }

            const finishReaction = () => {
                if (reactionTimeout) clearTimeout(reactionTimeout);
                if (audioSafetyTimeout) clearTimeout(audioSafetyTimeout);
                audio.pause();
                stopReactionVisuals();
            };

            if (soundUrl) {
                audio.src = soundUrl;
                audio.currentTime = 0;

                audio.onloadedmetadata = () => {
                    if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                        reactionDurationMs = (audio.duration + 0.3) * 1000;
                        if (reactionTimeout) clearTimeout(reactionTimeout);
                        reactionTimeout = setTimeout(finishReaction, reactionDurationMs);
                    }
                };

                audio.onended = finishReaction;
                audio.onerror = finishReaction;

                audio.play().catch(err => {
                    console.log("Autoplay blocked or error:", err);
                    reactionTimeout = setTimeout(finishReaction, reactionDurationMs);
                });

                audioSafetyTimeout = setTimeout(finishReaction, reactionDurationMs + 2000);
            } else {
                reactionTimeout = setTimeout(finishReaction, reactionDurationMs);
            }
        }

        // 📡 SSE 실시간 연동
        function initSSE() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const evtSource = new EventSource('/api/stream');

            evtSource.onopen = () => {
                if (statusDot) {
                    statusDot.style.backgroundColor = '#00ffcc';
                    statusDot.style.boxShadow = '0 0 8px #00ffcc';
                }
                if (statusText) statusText.innerText = '시그니처 서버 연결됨';
            };

            evtSource.onerror = () => {
                if (statusDot) {
                    statusDot.style.backgroundColor = '#ff007f';
                    statusDot.style.boxShadow = '0 0 8px #ff007f';
                }
                if (statusText) statusText.innerText = '재연결 시도 중...';
            };

            ['signature', 'donation', 'test_reaction', 'slot_spin'].forEach(evtName => {
                evtSource.addEventListener(evtName, (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        console.log(`[SSE] ${evtName}:`, data);
                        playReaction(data);
                    } catch (err) {
                        console.error('SSE Error:', err);
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSSE();
        });
    </script>
</body>
</html>

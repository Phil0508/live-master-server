<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 시그니처 위젯 전용 오버레이 (시각 전용)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c12;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #ffffff;
            color-scheme: only dark;
        }

        /* OBS 투명 모드 지원 (?transparent=1) */
        body.transparent-mode {
            background-color: transparent !important;
        }

        /* 🎵 overlay.html 원본 시그니처 위젯 CSS (기본 20초 100% 화면 유지) */
        .reaction-screen-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 600px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100010;
            padding: 0;
            box-sizing: border-box;
        }

        .reaction-screen-overlay.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .reaction-screen-overlay img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 25px rgba(0, 255, 204, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .reaction-text-donator {
            margin-top: 24px;
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 4px 20px rgba(0,0,0,0.9);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .reaction-text-message {
            margin-top: 14px;
            font-size: 32px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 0 18px rgba(0,255,204,0.7);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            word-break: break-all;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- 🎵 시그니처 위젯 레이어 (시각 화면 전용 - 소리 없음) -->
    <div id="reaction-screen-overlay" class="reaction-screen-overlay">
        <img id="reaction-screen-image" src="" alt="시그니처 사진">
        <div id="reaction-donator-info" class="reaction-text-donator"></div>
        <div id="reaction-message-info" class="reaction-text-message"></div>
    </div>

    <script>
        let globalData = null;
        let reactionTimeout = null;
        let reactionImgClearTimeout = null;

        // 기본 화면 유지 시간: 20초 (20,000ms)
        const DEFAULT_DISPLAY_TIME_MS = 20000;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('transparent') === '1') {
            document.body.classList.add('transparent-mode');
        }

        function formatNum(n) {
            return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function stopReactionVisuals() {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');

            if (overlay) {
                overlay.classList.remove('show');
            }
            if (reactionImgClearTimeout) clearTimeout(reactionImgClearTimeout);
            reactionImgClearTimeout = setTimeout(() => {
                if (img) img.src = "";
            }, 600);
        }

        function playReaction(data) {
            console.log('Playing reaction (Visual Only - Sound Muted):', data);
            
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const donatorEl = document.getElementById('reaction-donator-info');
            const messageEl = document.getElementById('reaction-message-info');
            
            if (!overlay || !img) return;
            
            // 1. 기존 타이머 초기화 (새 시그니처 오면 기존 타이머 리셋 후 20초 새로 시작)
            if (reactionTimeout) {
                clearTimeout(reactionTimeout);
                reactionTimeout = null;
            }
            if (reactionImgClearTimeout) {
                clearTimeout(reactionImgClearTimeout);
                reactionImgClearTimeout = null;
            }

            // 2. 후원자 이름 + 금액 (예: 홍길동 · 10,300원)
            let donatorName = data.donator || data.nickname || '익명';
            let donationAmount = data.amount ? formatNum(data.amount) + '원' : '';
            if (donatorEl) {
                donatorEl.innerText = donatorName + (donationAmount ? ' · ' + donationAmount : '');
            }

            // 3. 후원 메시지 또는 시그니처 제목
            let msgText = data.message || data.title || '';
            if (messageEl) {
                if (msgText && msgText !== '수동 후원 송출') {
                    messageEl.innerText = msgText;
                    messageEl.style.display = 'block';
                } else if (data.title) {
                    messageEl.innerText = data.title;
                    messageEl.style.display = 'block';
                } else {
                    messageEl.innerText = '';
                    messageEl.style.display = 'none';
                }
            }
            
            // 4. 시그니처 사진 이미지
            let imgUrl = data.image_url || (data.image_file ? `/media/images/${data.image_file}` : '/money.png');

            if (imgUrl) {
                img.src = imgUrl;
                img.style.display = 'block';
            } else {
                img.src = '/money.png';
                img.style.display = 'block';
            }
            
            // 5. 시그니처 팝업 화면에 100% 노출
            overlay.classList.add('show');

            // 6. 무조건 20초 동안 화면에 띄워두기 (새 시그니처 오면 20초 다시 시작)
            let finished = false;
            const finishReaction = (reason) => {
                if (finished) return;
                finished = true;
                console.log(`[20초 경과 종료] 이유: ${reason}`);
                if (reactionTimeout) clearTimeout(reactionTimeout);
                stopReactionVisuals();
            };

            // 정확히 20초 후 종료 타이머 설정 (이 페이지에서는 소리를 재생하지 않고 방송 오버레이 sound만 재생됨)
            reactionTimeout = setTimeout(() => {
                finishReaction('20초 기본 노출 시간 완료');
            }, DEFAULT_DISPLAY_TIME_MS);
        }

        function handleData(d) {
            globalData = d;

            if (d.reaction_mode && d.reaction_queue && d.reaction_queue.length > 0) {
                const firstItem = d.reaction_queue[0];
                playReaction(firstItem);
            }
        }

        // 📡 SSE 실시간 데이터 수신
        function initSSE() {
            const evtSource = new EventSource('/api/stream');

            evtSource.onmessage = (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            };

            evtSource.addEventListener('update', (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('donation', (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('test_reaction', (e) => {
                try { playReaction(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('signature', (e) => {
                try { playReaction(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('slot_spin', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data && data.winner) {
                        playReaction(data.winner);
                    }
                } catch(err) {}
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSSE();
        });
    </script>
</body>
</html>

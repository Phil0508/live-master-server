<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 시그니처 위젯 전용 오버레이</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c12;
            font-family: 'Pretendard', sans-serif;
            color-scheme: only dark;
        }

        /* OBS 투명 모드 지원 (?transparent=1) */
        body.transparent-mode {
            background-color: transparent !important;
        }

        /* 😴 대기 상태 안내 */
        #idle-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #idle-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .idle-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        .idle-title {
            font-size: 26px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 🎵 overlay.html 원본 시그니처 위젯 CSS (100% 그대로 유지) */
        .reaction-screen-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 550px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100010;
            padding: 0;
            box-sizing: border-box;
        }

        .reaction-screen-overlay.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .reaction-screen-overlay.show.minimize {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
        }

        .reaction-screen-overlay img {
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .reaction-text-donator {
            margin-top: 20px;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 4px 20px rgba(0,0,0,0.9);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .reaction-text-message {
            margin-top: 15px;
            font-size: 30px;
            font-weight: 700;
            color: #00ffcc;
            text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 0 15px rgba(0,255,204,0.6);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            word-break: break-all;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- 😴 대기 상태 안내 -->
    <div id="idle-container">
        <div class="idle-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">시그니처 서버 연결됨</span>
        </div>
        <div class="idle-title">📺 시그니처 송출 대기 중...</div>
    </div>

    <!-- 🎵 overlay.html 원본 시그니처 위젯 HTML 구조 100% 동일 -->
    <div id="reaction-screen-overlay" class="reaction-screen-overlay">
        <img id="reaction-screen-image" src="" alt="Reaction Image">
        <div id="reaction-donator-info" class="reaction-text-donator"></div>
        <div id="reaction-message-info" class="reaction-text-message"></div>
    </div>

    <audio id="reaction-audio" style="display:none;"></audio>

    <script>
        let globalData = null;
        let reactionTimeout = null;
        let reactionMinimizeTimeout = null;
        let reactionImgClearTimeout = null;
        let audioSafetyTimeout = null;
        let currentPlayingId = null;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('transparent') === '1') {
            document.body.classList.add('transparent-mode');
        }

        function formatNum(n) {
            return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function stopReactionVisuals() {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const idleContainer = document.getElementById('idle-container');

            if (overlay) {
                overlay.classList.remove('show');
                overlay.classList.remove('minimize');
            }
            if (reactionImgClearTimeout) clearTimeout(reactionImgClearTimeout);
            reactionImgClearTimeout = setTimeout(() => {
                if (img) img.src = "";
                if (idleContainer) idleContainer.classList.remove('hidden');
            }, 500);
        }

        function playReaction(data) {
            console.log('Playing reaction:', data);
            
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const donatorEl = document.getElementById('reaction-donator-info');
            const messageEl = document.getElementById('reaction-message-info');
            const audio = document.getElementById('reaction-audio');
            const idleContainer = document.getElementById('idle-container');
            
            if (!overlay || !img || !audio) return;
            
            if (reactionTimeout) clearTimeout(reactionTimeout);
            if (reactionMinimizeTimeout) clearTimeout(reactionMinimizeTimeout);
            if (reactionImgClearTimeout) { clearTimeout(reactionImgClearTimeout); reactionImgClearTimeout = null; }
            if (audioSafetyTimeout) { clearTimeout(audioSafetyTimeout); audioSafetyTimeout = null; }

            audio.onended = null;
            audio.onerror = null;
            audio.onloadedmetadata = null;
            audio.pause();
            audio.src = '';
            
            if (idleContainer) idleContainer.classList.add('hidden');

            let donatorName = data.donator || data.nickname || '익명';
            let donationAmount = data.amount ? formatNum(data.amount) + '원' : '';
            if (donatorEl) {
                donatorEl.innerText = donatorName + (donationAmount ? ' · ' + donationAmount : '');
            }

            let msgText = data.message || data.title || '';
            if (messageEl) {
                if (msgText && msgText !== '수동 후원 송출') {
                    messageEl.innerText = msgText;
                    messageEl.style.display = 'block';
                } else if (data.title) {
                    messageEl.innerText = data.title;
                    messageEl.style.display = 'block';
                } else {
                    messageEl.innerText = '';
                    messageEl.style.display = 'none';
                }
            }
            
            let imgUrl = data.image_url || (data.image_file ? `/media/images/${data.image_file}` : null);
            let soundUrl = data.audio_url || data.sound_url || (data.sound_file ? `/media/sounds/${data.sound_file}` : null);

            if (imgUrl) {
                img.src = imgUrl;
                img.style.display = 'block';
            } else {
                img.src = '/money.png';
                img.style.display = 'block';
            }
            
            overlay.classList.remove('minimize');
            overlay.classList.add('show');
            
            currentPlayingId = data.id || (donatorName + '_' + data.amount + '_' + (data.title || ''));

            let fallbackMs = 10000;
            if (data.duration && !isNaN(data.duration) && data.duration > 0) {
                fallbackMs = data.duration * 1000;
            }

            const finishOnce = () => {
                if (reactionTimeout) clearTimeout(reactionTimeout);
                if (audioSafetyTimeout) clearTimeout(audioSafetyTimeout);
                audio.pause();
                stopReactionVisuals();
            };

            if (soundUrl) {
                audio.src = soundUrl;
                audio.currentTime = 0;
                
                audio.onloadedmetadata = () => {
                    if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                        fallbackMs = (audio.duration + 0.3) * 1000;
                        if (reactionTimeout) clearTimeout(reactionTimeout);
                        reactionTimeout = setTimeout(finishOnce, fallbackMs);
                    }
                };

                audio.onended = finishOnce;
                audio.onerror = finishOnce;

                audio.play().catch(err => {
                    console.log("Audio play error:", err);
                    reactionTimeout = setTimeout(finishOnce, fallbackMs);
                });

                audioSafetyTimeout = setTimeout(finishOnce, fallbackMs + 2000);
            } else {
                reactionTimeout = setTimeout(finishOnce, fallbackMs);
            }
        }

        function handleData(d) {
            globalData = d;
            console.log('Received data:', d);

            if (d.reaction_mode && d.reaction_queue && d.reaction_queue.length > 0) {
                const firstItem = d.reaction_queue[0];
                playReaction(firstItem);
            }
        }

        // 📡 SSE 실시간 데이터 수신 (overlay.html 호환 100%)
        function initSSE() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const evtSource = new EventSource('/api/stream');

            evtSource.onopen = () => {
                if (statusDot) {
                    statusDot.style.backgroundColor = '#00ffcc';
                    statusDot.style.boxShadow = '0 0 8px #00ffcc';
                }
                if (statusText) statusText.innerText = '시그니처 서버 연결됨';
            };

            evtSource.onerror = () => {
                if (statusDot) {
                    statusDot.style.backgroundColor = '#ff007f';
                    statusDot.style.boxShadow = '0 0 8px #ff007f';
                }
                if (statusText) statusText.innerText = '재연결 시도 중...';
            };

            evtSource.onmessage = (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            };

            evtSource.addEventListener('update', (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('donation', (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('test_reaction', (e) => {
                try { playReaction(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('signature', (e) => {
                try { playReaction(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('slot_spin', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data && data.winner) {
                        playReaction(data.winner);
                    }
                } catch(err) {}
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSSE();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 시그니처 위젯 전용 오버레이</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c12;
            font-family: 'Pretendard', sans-serif;
            color-scheme: only dark;
        }

        /* OBS 투명 모드 지원 (?transparent=1) */
        body.transparent-mode {
            background-color: transparent !important;
        }

        /* 😴 대기 상태 안내 */
        #idle-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #idle-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .idle-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        .idle-title {
            font-size: 26px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 🎵 overlay.html 원본 시그니처 위젯 CSS (100% 동일 + 음원 끝날 때까지 100% 화면 유지) */
        .reaction-screen-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 600px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100010;
            padding: 0;
            box-sizing: border-box;
        }

        .reaction-screen-overlay.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .reaction-screen-overlay img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 25px rgba(0, 255, 204, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .reaction-text-donator {
            margin-top: 24px;
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 4px 20px rgba(0,0,0,0.9);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .reaction-text-message {
            margin-top: 14px;
            font-size: 32px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 0 18px rgba(0,255,204,0.7);
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            word-break: break-all;
            padding: 0 20px;
        }

        /* 🔊 브라우저 자동재생 차단 해제 클릭 안내 배너 */
        #autoplay-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100020;
            background: rgba(255, 0, 127, 0.9);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(255,0,127,0.5);
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <div id="autoplay-banner" onclick="unlockAudio()">
        🔊 오디오 자동재생을 허용하려면 화면 아무 곳이나 클릭하세요!
    </div>

    <!-- 😴 대기 상태 안내 -->
    <div id="idle-container">
        <div class="idle-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">시그니처 서버 연결됨</span>
        </div>
        <div class="idle-title">📺 시그니처 송출 대기 중...</div>
    </div>

    <!-- 🎵 시그니처 위젯 레이어 (음원 끝날 때까지 100% 화면 유지) -->
    <div id="reaction-screen-overlay" class="reaction-screen-overlay">
        <img id="reaction-screen-image" src="" alt="시그니처 사진">
        <div id="reaction-donator-info" class="reaction-text-donator"></div>
        <div id="reaction-message-info" class="reaction-text-message"></div>
    </div>

    <audio id="reaction-audio" style="display:none;"></audio>

    <script>
        let globalData = null;
        let reactionTimeout = null;
        let reactionImgClearTimeout = null;
        let audioUnlocked = false;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('transparent') === '1') {
            document.body.classList.add('transparent-mode');
        }

        function unlockAudio() {
            const audio = document.getElementById('reaction-audio');
            if (audio) {
                audio.play().then(() => {
                    audio.pause();
                    audioUnlocked = true;
                    document.getElementById('autoplay-banner').style.display = 'none';
                }).catch(() => {});
            }
        }
        document.addEventListener('click', unlockAudio, { once: false });

        function formatNum(n) {
            return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function stopReactionVisuals() {
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const idleContainer = document.getElementById('idle-container');

            if (overlay) {
                overlay.classList.remove('show');
            }
            if (reactionImgClearTimeout) clearTimeout(reactionImgClearTimeout);
            reactionImgClearTimeout = setTimeout(() => {
                if (img) img.src = "";
                if (idleContainer) idleContainer.classList.remove('hidden');
            }, 600);
        }

        function playReaction(data) {
            console.log('Playing reaction (perfect audio sync):', data);
            
            const overlay = document.getElementById('reaction-screen-overlay');
            const img = document.getElementById('reaction-screen-image');
            const donatorEl = document.getElementById('reaction-donator-info');
            const messageEl = document.getElementById('reaction-message-info');
            const audio = document.getElementById('reaction-audio');
            const idleContainer = document.getElementById('idle-container');
            
            if (!overlay || !img || !audio) return;
            
            // 1. 이전 타이머 및 오디오 강제 중지
            if (reactionTimeout) {
                clearTimeout(reactionTimeout);
                reactionTimeout = null;
            }
            if (reactionImgClearTimeout) {
                clearTimeout(reactionImgClearTimeout);
                reactionImgClearTimeout = null;
            }

            audio.onended = null;
            audio.onerror = null;
            audio.onloadedmetadata = null;
            audio.pause();
            audio.src = '';
            
            // 2. 대기 안내 숨기기 & 화면 띄우기
            if (idleContainer) idleContainer.classList.add('hidden');

            let donatorName = data.donator || data.nickname || '익명';
            let donationAmount = data.amount ? formatNum(data.amount) + '원' : '';
            if (donatorEl) {
                donatorEl.innerText = donatorName + (donationAmount ? ' · ' + donationAmount : '');
            }

            let msgText = data.message || data.title || '';
            if (messageEl) {
                if (msgText && msgText !== '수동 후원 송출') {
                    messageEl.innerText = msgText;
                    messageEl.style.display = 'block';
                } else if (data.title) {
                    messageEl.innerText = data.title;
                    messageEl.style.display = 'block';
                } else {
                    messageEl.innerText = '';
                    messageEl.style.display = 'none';
                }
            }
            
            let imgUrl = data.image_url || (data.image_file ? `/media/images/${data.image_file}` : '/money.png');
            let soundUrl = data.audio_url || data.sound_url || (data.sound_file ? `/media/sounds/${data.sound_file}` : null);

            if (imgUrl) {
                img.src = imgUrl;
                img.style.display = 'block';
            } else {
                img.src = '/money.png';
                img.style.display = 'block';
            }
            
            // 시그니처 팝업 화면에 노출 (Keep 100% visible)
            overlay.classList.add('show');

            // 마침 콜백 함수 (음원이 완벽히 종료될 때만 호출)
            let finished = false;
            const finishReaction = (reason) => {
                if (finished) return;
                finished = true;
                console.log(`[시그니처 종료] 이유: ${reason}`);
                if (reactionTimeout) clearTimeout(reactionTimeout);
                audio.pause();
                stopReactionVisuals();
            };

            // 3. 음원 연동 및 종료 시점 완벽 동기화
            if (soundUrl) {
                audio.src = soundUrl;
                audio.currentTime = 0;

                // 음원이 끝났을 때만 사라지도록 동기화!
                audio.onended = () => {
                    finishReaction('음원 재생 완료 (onended)');
                };

                audio.onerror = () => {
                    console.log('Audio load error, fallback to duration timer');
                    let durationSec = (data.duration && data.duration > 0) ? data.duration : 10;
                    reactionTimeout = setTimeout(() => finishReaction('음원 에러 후 타이머 완료'), durationSec * 1000);
                };

                audio.play().then(() => {
                    document.getElementById('autoplay-banner').style.display = 'none';
                }).catch(err => {
                    console.log("Audio autoplay blocked by browser policy:", err);
                    document.getElementById('autoplay-banner').style.display = 'block';
                    // 자동재생 차단 시에도 지정된 재생 시간(duration) 동안 사진 유지
                    let durationSec = (data.duration && data.duration > 0) ? data.duration : 10;
                    reactionTimeout = setTimeout(() => finishReaction('자동재생 차단 후 타이머 완료'), durationSec * 1000);
                });
            } else {
                // 음원이 없는 시그니처인 경우 지정된 duration(초) 동안 유지
                let durationSec = (data.duration && data.duration > 0) ? data.duration : 10;
                reactionTimeout = setTimeout(() => finishReaction('음원 없음 타이머 완료'), durationSec * 1000);
            }
        }

        function handleData(d) {
            globalData = d;

            if (d.reaction_mode && d.reaction_queue && d.reaction_queue.length > 0) {
                const firstItem = d.reaction_queue[0];
                playReaction(firstItem);
            }
        }

        // 📡 SSE 실시간 데이터 수신
        function initSSE() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const evtSource = new EventSource('/api/stream');

            evtSource.onopen = () => {
                if (statusDot) {
                    statusDot.style.backgroundColor = '#00ffcc';
                    statusDot.style.boxShadow = '0 0 8px #00ffcc';
                }
                if (statusText) statusText.innerText = '시그니처 서버 연결됨';
            };

            evtSource.onerror = () => {
                if (statusDot) {
                    statusDot.style.backgroundColor = '#ff007f';
                    statusDot.style.boxShadow = '0 0 8px #ff007f';
                }
                if (statusText) statusText.innerText = '재연결 시도 중...';
            };

            evtSource.onmessage = (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            };

            evtSource.addEventListener('update', (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('donation', (e) => {
                try { handleData(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('test_reaction', (e) => {
                try { playReaction(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('signature', (e) => {
                try { playReaction(JSON.parse(e.data)); } catch(err) {}
            });

            evtSource.addEventListener('slot_spin', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data && data.winner) {
                        playReaction(data.winner);
                    }
                } catch(err) {}
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSSE();
        });
    </script>
</body>
</html>

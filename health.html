<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>서버 상태</title>
<style>
:root{
  --bg:#0b0d12; --card:#151922; --line:#232936;
  --tx:#e8ecf4; --dim:#8b93a7;
  --ok:#22c98a; --warn:#f5a524; --bad:#ff4d5e; --accent:#4da3ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  padding:16px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:560px; margin-inline:auto;
}
h1{font-size:15px; margin:0; color:var(--dim); font-weight:600; letter-spacing:.02em}
.host{font-size:12px; color:var(--dim); opacity:.75; margin-top:3px; word-break:break-all}

/* 큰 신호등 — 폰을 멀리서 봐도 색만으로 판단되게 */
.big{
  margin:16px 0 14px; padding:22px 18px; border-radius:18px;
  background:var(--card); border:1px solid var(--line);
  display:flex; align-items:center; gap:16px;
}
.dot{width:52px; height:52px; border-radius:50%; flex:none; position:relative}
.dot::after{
  content:''; position:absolute; inset:-8px; border-radius:50%;
  border:2px solid currentColor; opacity:.28; animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.82);opacity:.5} 100%{transform:scale(1.25);opacity:0}}
.big .label{font-size:26px; font-weight:800; letter-spacing:-.02em}
.big .sub{font-size:13px; color:var(--dim); margin-top:4px}

.s-ok   .dot{background:var(--ok);   color:var(--ok)}
.s-ok   .label{color:var(--ok)}
.s-warn .dot{background:var(--warn); color:var(--warn)}
.s-warn .label{color:var(--warn)}
.s-bad  .dot{background:var(--bad);  color:var(--bad)}
.s-bad  .label{color:var(--bad)}
.s-bad .dot::after{animation:none}

/* 응답속도 막대 — 최근 흐름이 보여야 '가끔 튀는' 것을 잡는다 */
.lat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px}
.lat .top{display:flex; justify-content:space-between; align-items:baseline}
.lat .n{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
.lat .n small{font-size:13px; font-weight:600; color:var(--dim); margin-left:2px}
.bars{display:flex; gap:3px; align-items:flex-end; height:34px; margin-top:10px}
.bars i{flex:1; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; opacity:.75}
.bars i.slow{background:var(--warn)}
.bars i.fail{background:var(--bad); height:100%!important; opacity:.5}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.c{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px}
.c .k{font-size:11px; color:var(--dim); letter-spacing:.03em}
.c .v{font-size:19px; font-weight:700; margin-top:5px; font-variant-numeric:tabular-nums; word-break:break-all}
.c .v small{font-size:12px; color:var(--dim); font-weight:600}
.c.wide{grid-column:1 / -1}
.v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{font-size:12px; padding:5px 10px; border-radius:999px; background:#1e2431; color:var(--dim); border:1px solid var(--line)}
.chip.on{background:rgba(77,163,255,.14); color:var(--accent); border-color:rgba(77,163,255,.35)}

.sec{margin-top:12px}
.sec h2{font-size:11px; color:var(--dim); letter-spacing:.06em; margin:0 0 8px 2px; font-weight:600}

.foot{margin-top:16px; text-align:center; font-size:12px; color:var(--dim)}
.foot b{color:var(--tx); font-weight:600; font-variant-numeric:tabular-nums}
button{
  margin-top:12px; width:100%; padding:14px; font-size:15px; font-weight:700;
  background:var(--card); color:var(--tx); border:1px solid var(--line);
  border-radius:14px; font-family:inherit; cursor:pointer;
}
button:active{background:#1c2230}
@media (prefers-reduced-motion:reduce){ .dot::after{animation:none} }
</style>
</head>
<body>

<h1>서버 상태</h1>
<div class="host" id="host">—</div>

<div class="big s-warn" id="big">
  <div class="dot"></div>
  <div>
    <div class="label" id="bigLabel">확인 중</div>
    <div class="sub" id="bigSub">서버에 물어보는 중입니다</div>
  </div>
</div>

<div class="lat">
  <div class="top">
    <span class="k" style="font-size:11px;color:var(--dim)">응답 속도 (내 폰 기준)</span>
    <span class="n" id="lat">—<small>ms</small></span>
  </div>
  <div class="bars" id="bars"></div>
</div>

<div class="grid">
  <div class="c"><div class="k">저장소</div><div class="v" id="db">—</div></div>
  <div class="c"><div class="k">가동 시간</div><div class="v" id="up">—</div></div>
  <div class="c"><div class="k">메모리</div><div class="v" id="mem">—</div></div>
  <div class="c"><div class="k">접속 화면</div><div class="v" id="sse">—</div></div>
  <div class="c"><div class="k">대기함</div><div class="v" id="pending">—</div></div>
  <div class="c"><div class="k">시그니처 큐</div><div class="v" id="queue">—</div></div>
  <div class="c wide">
    <div class="k">진행 중인 것</div>
    <div class="chips" id="modes"><span class="chip">—</span></div>
  </div>
  <div class="c wide"><div class="k">마지막 후원</div><div class="v" id="lastdon">—</div></div>
</div>

<div class="sec" id="privSec" hidden>
  <h2>운영자에게만 보이는 항목</h2>
  <div class="grid">
    <div class="c"><div class="k">관리자 키</div><div class="v" id="pKey">—</div></div>
    <div class="c"><div class="k">외부 노출</div><div class="v" id="pBind">—</div></div>
    <div class="c"><div class="k">깨워두기</div><div class="v" id="pPing">—</div></div>
    <div class="c"><div class="k">AI 키</div><div class="v" id="pAi">—</div></div>
  </div>
</div>

<button id="refresh">지금 새로고침</button>
<div class="foot">5초마다 저절로 확인합니다 · 마지막 확인 <b id="stamp">—</b></div>

<script>
(function () {
  'use strict';

  var MAX_BARS = 24;
  var SLOW_MS = 400;      // 이보다 느리면 막대를 주황으로
  var hist = [];
  var timer = null;

  var $ = function (id) { return document.getElementById(id); };
  $('host').textContent = location.host;

  function fmtAge(sec) {
    if (sec === null || sec === undefined) return null;
    if (sec < 60) return sec + '초';
    if (sec < 3600) return Math.floor(sec / 60) + '분';
    if (sec < 86400) return Math.floor(sec / 3600) + '시간 ' + Math.floor(sec % 3600 / 60) + '분';
    return Math.floor(sec / 86400) + '일 ' + Math.floor(sec % 86400 / 3600) + '시간';
  }

  function setBig(cls, label, sub) {
    $('big').className = 'big ' + cls;
    $('bigLabel').textContent = label;
    $('bigSub').textContent = sub;
  }

  function drawBars() {
    var max = 1;
    hist.forEach(function (h) { if (h.ms && h.ms > max) max = h.ms; });
    // 눈금이 한 번의 튐 때문에 다 눌리지 않게 하한을 둔다
    if (max < 200) max = 200;
    $('bars').innerHTML = hist.map(function (h) {
      if (!h.ok) return '<i class="fail"></i>';
      var pct = Math.max(4, Math.round(h.ms / max * 100));
      return '<i class="' + (h.ms >= SLOW_MS ? 'slow' : '') + '" style="height:' + pct + '%"></i>';
    }).join('');
  }

  function push(ok, ms) {
    hist.push({ ok: ok, ms: ms });
    if (hist.length > MAX_BARS) hist.shift();
    drawBars();
  }

  function unreachable(why) {
    setBig('s-bad', '연결 안 됨', why);
    $('lat').innerHTML = '—<small>ms</small>';
    ['db', 'up', 'mem', 'sse', 'pending', 'queue', 'lastdon'].forEach(function (id) {
      $(id).textContent = '—';
      $(id).className = 'v';
    });
    $('modes').innerHTML = '<span class="chip">—</span>';
    $('privSec').hidden = true;
  }

  function paint(d, ms) {
    $('lat').innerHTML = Math.round(ms) + '<small>ms</small>';

    var st = d.storage || {};
    if (!st.ok) {
      setBig('s-bad', '이상', '서버는 살아 있는데 데이터베이스에 못 붙습니다');
    } else if (d.status !== 'ok') {
      setBig('s-warn', '주의', '일부 기능이 정상이 아닙니다');
    } else if (!st.persistent) {
      setBig('s-warn', '주의', '임시 저장소로 돌고 있습니다 (데이터가 안 남습니다)');
    } else {
      setBig('s-ok', '정상', '서버가 잘 돌아가고 있습니다');
    }

    $('db').textContent = st.ok
      ? (st.persistent ? 'Supabase' : '임시(로컬)') + ' · ' + st.latency_ms + 'ms'
      : '끊김 (' + (st.error || '?') + ')';
    $('db').className = 'v ' + (st.ok ? (st.persistent ? 'ok' : 'warn') : 'bad');

    // 가동시간이 짧으면 방금 재시작된 것 — 반복되면 그 자체가 문제 신호다
    var up = d.uptime_sec || 0;
    $('up').textContent = fmtAge(up);
    $('up').className = 'v ' + (up < 300 ? 'warn' : '');

    $('mem').innerHTML = (d.rss_mb === null || d.rss_mb === undefined)
      ? '—' : d.rss_mb + '<small> MB</small>';
    // 1GB 서버 기준. 여유가 없어지면 색으로 알린다.
    $('mem').className = 'v ' + (d.rss_mb > 700 ? 'bad' : d.rss_mb > 400 ? 'warn' : '');

    $('sse').innerHTML = (d.sse_clients || 0) + '<small> 대</small>';

    var c = d.counts || {};
    $('pending').innerHTML = (c.pending || 0) + '<small> 건</small>';
    $('pending').className = 'v ' + (c.pending >= 20 ? 'warn' : '');
    $('queue').innerHTML = (c.reaction_queue || 0) + '<small> 개</small>';
    // 큐 상한이 40이라 가까워지면 뒤엣것부터 버려진다
    $('queue').className = 'v ' + (c.reaction_queue >= 30 ? 'warn' : '');

    var age = fmtAge(d.last_donation_age_sec);
    $('lastdon').textContent = age ? age + ' 전' : '아직 없음';

    var m = d.modes || {};
    var names = { reaction: '시그니처', match: '대결', karaoke: '노래방', home_race: '퇴근빵' };
    $('modes').innerHTML = Object.keys(names).map(function (k) {
      return '<span class="chip' + (m[k] ? ' on' : '') + '">' + names[k] + '</span>';
    }).join('') || '<span class="chip">—</span>';

    var p = d.private;
    $('privSec').hidden = !p;
    if (p) {
      $('pKey').textContent = p.weak_admin_secret ? '기본값 — 위험' : '설정됨';
      $('pKey').className = 'v ' + (p.weak_admin_secret ? 'bad' : 'ok');
      var open = p.bind_host !== '127.0.0.1';
      $('pBind').textContent = open ? p.bind_host + ' — 열림' : '차단됨';
      $('pBind').className = 'v ' + (open ? 'warn' : 'ok');
      $('pPing').textContent = p.self_ping_blocked ? '막아둠' : (p.self_ping_enabled ? '켜짐' : '꺼짐');
      $('pAi').textContent = p.ai_key_present ? '있음' : '없음';
      $('pAi').className = 'v ' + (p.ai_key_present ? 'ok' : 'warn');
    }

    $('stamp').textContent = new Date().toLocaleTimeString('ko-KR');
  }

  function check() {
    var t0 = performance.now();
    // 8초 안에 응답이 없으면 죽은 것으로 본다. 폰에서 무한정 기다리면
    // '확인 중'만 계속 떠서 살았는지 죽었는지 알 수가 없다.
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var killer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);

    fetch('/api/health?_=' + Date.now(), {
      cache: 'no-store',
      credentials: 'same-origin',
      signal: ctl ? ctl.signal : undefined
    })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        clearTimeout(killer);
        var ms = performance.now() - t0;
        push(true, ms);
        paint(d, ms);
      })
      .catch(function (e) {
        clearTimeout(killer);
        push(false, null);
        unreachable(e.name === 'AbortError'
          ? '8초 동안 응답이 없습니다'
          : '서버에 닿지 않습니다 (' + (e.message || e.name) + ')');
        $('stamp').textContent = new Date().toLocaleTimeString('ko-KR');
      });
  }

  function start() {
    clearInterval(timer);
    check();
    timer = setInterval(check, 5000);
  }

  $('refresh').addEventListener('click', check);

  // 폰에서 화면을 껐다 켜면 그동안의 확인은 의미가 없다. 돌아오면 바로 새로 본다.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else { start(); }
  });

  start();
})();
</script>
</body>
</html>

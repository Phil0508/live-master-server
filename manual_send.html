<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후원 콘솔</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="/comma_input.js"></script>
<style>
    :root{
        --bg:#0d0e12; --surface:#15171e; --surface-2:#1b1e27; --surface-3:#22252f;
        --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.12);
        --text:#f3f4f6; --muted:#8b8f9c; --faint:#5c6070;
        --accent:#7c6cff; --accent-2:#9d8bff; --accent-soft:rgba(124,108,255,0.14);
        --gold:#ffcb45; --mint:#2fe6b0; --pink:#ff5c8a;
        --shadow:0 12px 40px rgba(0,0,0,0.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(1200px 600px at 50% -10%,rgba(124,108,255,0.10),transparent 55%),var(--bg);color:var(--text);font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;min-height:100vh;padding:28px 22px 60px;-webkit-font-smoothing:antialiased}
    .shell{max-width:1120px;margin:0 auto}

    /* ── 헤더 ── */
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px}
    .brand{display:flex;align-items:center;gap:13px}
    .brand .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 22px rgba(124,108,255,0.4)}
    .brand h1{font-size:20px;font-weight:800;letter-spacing:-0.4px;line-height:1.15}
    .brand p{font-size:12.5px;color:var(--muted);margin-top:2px}
    .topbar .home{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:9px 14px;border:1px solid var(--border);border-radius:10px;transition:all .15s}
    .topbar .home:hover{color:var(--text);border-color:var(--border-2);background:var(--surface)}

    /* ── 탭바 ── */
    .tabs{display:inline-flex;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:22px}
    .tab{border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:700;padding:10px 20px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .18s;font-family:inherit}
    .tab:hover{color:var(--text)}
    .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 18px rgba(124,108,255,0.35)}
    .pane{display:none;animation:fade .3s ease}
    .pane.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    /* ── 송출 그리드 ── */
    .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
    @media(max-width:860px){.grid{grid-template-columns:1fr}}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
    .card-pad{padding:22px}

    /* 미리보기(알림 카드 느낌) */
    .preview{position:relative;overflow:hidden;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;background:linear-gradient(165deg,#191c25,#111219)}
    .preview .aura{position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:420px;height:420px;background:radial-gradient(circle,var(--accent-soft),transparent 62%);pointer-events:none}
    .pv-badge{position:absolute;top:16px;left:16px;font-size:11px;font-weight:800;color:var(--accent-2);background:var(--accent-soft);padding:5px 11px;border-radius:20px;letter-spacing:0.3px}
    .pv-imgwrap{position:relative;width:216px;height:216px;border-radius:20px;overflow:hidden;background:#0c0d12;border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 16px 40px rgba(0,0,0,0.55)}
    .pv-imgwrap img{width:100%;height:100%;object-fit:cover;display:none}
    .pv-empty{color:var(--faint);font-size:13px;line-height:1.7;padding:0 22px}
    .pv-title{font-size:21px;font-weight:800;margin-bottom:3px;display:none;letter-spacing:-0.3px}
    .pv-amt{font-size:14px;color:var(--gold);font-weight:800;margin-bottom:16px;display:none}
    .pv-line{font-size:16.5px;line-height:1.5;max-width:330px}
    .pv-line .donor{color:var(--accent-2);font-weight:800}
    .pv-line .amt{color:var(--gold);font-weight:800}
    .pv-msg{margin-top:11px;font-size:14px;color:#dfe1e8;font-weight:600;max-width:340px;word-break:break-word;display:none;background:rgba(255,255,255,0.04);padding:9px 14px;border-radius:12px}

    /* 입력 */
    .fld{margin-bottom:15px}
    .fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px;letter-spacing:0.2px}
    .fld input,.fld textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;color:#fff;font-size:14px;padding:12px 14px;outline:none;transition:border .15s,box-shadow .15s;font-family:inherit}
    .fld input:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .fld textarea{resize:vertical;min-height:66px}
    #in-amount{font-size:22px;font-weight:800;letter-spacing:0.4px}
    .amt-wrap{position:relative}
    .amt-wrap .won{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px;font-weight:700;pointer-events:none}
    .match-info{font-size:12.5px;font-weight:700;margin-top:9px;min-height:18px}
    .match-info.exact{color:var(--mint)}.match-info.roundup{color:var(--gold)}.match-info.none{color:var(--pink)}

    .chk{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--muted);cursor:pointer;margin:4px 0 16px;line-height:1.5}
    .chk input{width:17px;height:17px;margin-top:1px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
    .chk b{color:#dcdee5}
    .send-btn{width:100%;height:52px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,box-shadow .2s;box-shadow:0 8px 24px rgba(124,108,255,0.4)}
    .send-btn:hover{box-shadow:0 10px 30px rgba(124,108,255,0.55)}
    .send-btn:active{transform:scale(0.98)}
    .send-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

    /* 갤러리 */
    .gal-head{font-size:13px;font-weight:800;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
    .gal-head .count{font-size:11px;color:var(--accent-2);background:var(--accent-soft);padding:3px 9px;border-radius:12px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:11px;max-height:360px;overflow-y:auto;padding:3px}
    .gcell{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;overflow:hidden;cursor:pointer;transition:all .14s;text-align:center}
    .gcell:hover{border-color:var(--border-2);transform:translateY(-2px)}
    .gcell.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
    .gcell .thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#0c0d12;display:block}
    .gcell .gamt{font-size:11.5px;font-weight:800;color:var(--gold);padding:6px 2px 2px}
    .gcell .gtit{font-size:10px;color:var(--muted);padding:0 4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ── 후원 순위 ── */
    .rank-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    .rank-stats{display:flex;gap:12px}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 20px;min-width:130px}
    .stat .k{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
    .stat .v{font-size:22px;font-weight:800;letter-spacing:-0.5px}
    .stat .v.gold{color:var(--gold)}
    .refresh{display:flex;align-items:center;gap:10px}
    .refresh .auto{font-size:12px;color:var(--faint)}
    .refresh button{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;padding:10px 15px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;font-family:inherit}
    .refresh button:hover{border-color:var(--accent);color:var(--accent-2)}
    .rank-list{display:flex;flex-direction:column;gap:9px}
    .rrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;transition:transform .1s}
    .rrow .pos{width:38px;flex-shrink:0;text-align:center;font-size:18px;font-weight:800;color:var(--muted)}
    .rrow.top1{background:linear-gradient(100deg,rgba(255,203,69,0.14),var(--surface) 60%);border-color:rgba(255,203,69,0.35)}
    .rrow.top2{background:linear-gradient(100deg,rgba(197,204,220,0.12),var(--surface) 60%);border-color:rgba(197,204,220,0.28)}
    .rrow.top3{background:linear-gradient(100deg,rgba(214,150,90,0.13),var(--surface) 60%);border-color:rgba(214,150,90,0.3)}
    .rrow .pos .medal{font-size:22px}
    .rrow .nm{flex:1;font-size:16px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rrow .cnt{font-size:11.5px;color:var(--muted);background:var(--surface-3);padding:4px 10px;border-radius:20px;font-weight:700;flex-shrink:0}
    .rrow .tot{font-size:18px;font-weight:800;color:var(--gold);flex-shrink:0;min-width:110px;text-align:right;letter-spacing:-0.3px}
    .rank-empty{text-align:center;color:var(--faint);padding:60px 20px;font-size:14px;line-height:1.7}

    /* 토스트 */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;font-size:14px;padding:14px 24px;border-radius:30px;box-shadow:0 10px 34px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(0.16,1,0.3,1);z-index:999}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.err{background:linear-gradient(135deg,#ff4d6d,#ff7a92)}
</style>
</head>
<body>
<div class="shell">
    <div class="topbar">
        <div class="brand">
            <div class="logo">🎁</div>
            <div>
                <h1>후원 콘솔</h1>
                <p>수동 송출 · 후원 순위</p>
            </div>
        </div>
        <a class="home" href="/controller"><i class="fa-solid fa-arrow-left"></i> 조종실로</a>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-btn-send" onclick="switchTab('send')"><i class="fa-solid fa-paper-plane"></i> 수동 송출</button>
        <button class="tab" id="tab-btn-rank" onclick="switchTab('rank')"><i class="fa-solid fa-trophy"></i> 후원 순위</button>
    </div>

    <!-- ═══ 수동 송출 ═══ -->
    <div class="pane active" id="pane-send">
        <div class="grid">
            <div class="card preview">
                <div class="aura"></div>
                <div class="pv-badge">LIVE PREVIEW</div>
                <div class="pv-imgwrap">
                    <img id="pv-img" alt="">
                    <div class="pv-empty" id="pv-empty">금액을 입력하면<br>매칭되는 시그니처가<br>여기에 표시됩니다</div>
                </div>
                <div class="pv-title" id="pv-title"></div>
                <div class="pv-amt" id="pv-amt"></div>
                <div class="pv-line" id="pv-line"></div>
                <div class="pv-msg" id="pv-msg"></div>
            </div>

            <div class="card card-pad">
                <div class="fld">
                    <label>후원 금액</label>
                    <div class="amt-wrap">
                        <input type="number" id="in-amount" placeholder="10,000" min="0" inputmode="numeric" autocomplete="off">
                        <span class="won">원</span>
                    </div>
                    <div class="match-info" id="match-info"></div>
                </div>
                <div class="fld">
                    <label>후원자명</label>
                    <input type="text" id="in-donor" placeholder="비우면 '수동송출'" autocomplete="off">
                </div>
                <div class="fld">
                    <label>후원 메시지 <span style="color:var(--faint);font-weight:500">(선택)</span></label>
                    <textarea id="in-msg" placeholder="화면에 함께 표시할 메시지"></textarea>
                </div>
                <label class="chk">
                    <input type="checkbox" id="in-ledger">
                    <span><b>정산 장부에 기록</b> — 체크하면 실제 후원처럼 장부·승인대기함·후원 순위에 반영되고, 안 하면 재생만 됩니다.</span>
                </label>
                <button class="send-btn" id="btn-send"><i class="fa-solid fa-paper-plane"></i> 시그니처 송출</button>

                <div class="gal-head"><i class="fa-solid fa-compact-disc" style="color:var(--accent-2)"></i> 빠른 선택 <span class="count" id="gal-count">0개</span></div>
                <div class="gallery" id="gallery"><div style="color:var(--muted);font-size:12px;grid-column:1/-1;padding:18px;text-align:center">시그니처 목록을 불러오는 중…</div></div>
            </div>
        </div>
    </div>

    <!-- ═══ 후원 순위 ═══ -->
    <div class="pane" id="pane-rank">
        <div class="rank-head">
            <div class="rank-stats">
                <div class="stat"><div class="k">누적 후원 합계</div><div class="v gold" id="stat-total">0원</div></div>
                <div class="stat"><div class="k">후원자 수</div><div class="v" id="stat-donors">0명</div></div>
            </div>
            <div class="refresh">
                <span class="auto"><i class="fa-solid fa-rotate"></i> 8초마다 자동 갱신</span>
                <button onclick="loadRanking(true)"><i class="fa-solid fa-arrows-rotate"></i> 새로고침</button>
            </div>
        </div>
        <div class="rank-list" id="rank-list"><div class="rank-empty">불러오는 중…</div></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let SIGS = [];
    let currentMatchId = null;
    let rankTimer = null;

    const $ = id => document.getElementById(id);
    const fmt = n => (n||0).toLocaleString('ko-KR');
    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    /* ── 탭 전환 ── */
    function switchTab(which){
        $('tab-btn-send').classList.toggle('active', which==='send');
        $('tab-btn-rank').classList.toggle('active', which==='rank');
        $('pane-send').classList.toggle('active', which==='send');
        $('pane-rank').classList.toggle('active', which==='rank');
        if(which==='rank'){ loadRanking(true); startRankAuto(); }
        else { stopRankAuto(); }
    }

    /* ── 매칭 (서버 로직과 동일: 입력 이상인 가장 싼 시그니처 → 없으면 최고가) ── */
    function matchSig(amount){
        if(!SIGS.length || amount<=0) return null;
        for(const s of SIGS){ if((s.amount||0) >= amount) return s; }
        return SIGS[SIGS.length-1];
    }

    function updatePreview(){
        const amount = rawNum('in-amount');
        const donor = $('in-donor').value.trim() || '수동송출';
        const msg = $('in-msg').value.trim();
        const sig = matchSig(amount);
        const info = $('match-info');

        if(amount<=0){ info.textContent=''; info.className='match-info'; }
        else if(!sig){ info.textContent='매칭할 시그니처가 없습니다'; info.className='match-info none'; }
        else if((sig.amount||0)===amount){ info.innerHTML='✓ 정확히 일치'; info.className='match-info exact'; }
        else { info.innerHTML='↑ 올림 매칭 → <b>'+fmt(sig.amount)+'원</b> 시그니처'; info.className='match-info roundup'; }

        currentMatchId = sig ? sig.id : null;
        const img=$('pv-img'), empty=$('pv-empty'), title=$('pv-title'), amt=$('pv-amt');
        if(sig && sig.image_url){ img.src=sig.image_url; img.style.display='block'; empty.style.display='none'; }
        else { img.style.display='none'; img.src=''; empty.style.display='block'; }
        if(sig){ title.textContent=sig.title||'시그니처'; title.style.display='block'; amt.textContent=fmt(sig.amount)+'원 시그니처'; amt.style.display='block'; }
        else { title.style.display='none'; amt.style.display='none'; }

        $('pv-line').innerHTML = amount>0
            ? '<span class="donor">'+escapeHtml(donor)+'</span>님이 <span class="amt">'+fmt(amount)+'원</span> 후원!'
            : '';
        const pvMsg=$('pv-msg');
        if(msg){ pvMsg.textContent=msg; pvMsg.style.display='block'; } else { pvMsg.style.display='none'; }

        document.querySelectorAll('.gcell').forEach(c=>{
            c.classList.toggle('active', currentMatchId!==null && String(c.dataset.id)===String(currentMatchId));
        });
    }

    function renderGallery(){
        const g=$('gallery');
        $('gal-count').textContent=SIGS.length+'개';
        if(!SIGS.length){ g.innerHTML='<div style="color:var(--muted);font-size:12px;grid-column:1/-1;padding:18px;text-align:center">등록된 시그니처가 없습니다</div>'; return; }
        g.innerHTML = SIGS.map(s=>`
            <div class="gcell" data-id="${s.id}" data-amount="${s.amount||0}" title="${escapeHtml(s.title||'')}">
                ${s.image_url?`<img class="thumb" src="${s.image_url}" alt="">`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#4a4d5a"><i class="fa-solid fa-music"></i></div>`}
                <div class="gamt">${fmt(s.amount)}원</div>
                <div class="gtit">${escapeHtml(s.title||'')}</div>
            </div>`).join('');
        g.querySelectorAll('.gcell').forEach(c=>{
            c.addEventListener('click',()=>{ $('in-amount').value=c.dataset.amount; commaFormat('in-amount'); updatePreview(); $('in-amount').focus(); });
        });
    }

    async function loadSigs(){
        try{
            const res=await fetch('/api/signatures');
            const data=await res.json();
            SIGS=(data.signatures||[]).slice().sort((a,b)=>(a.amount||0)-(b.amount||0));
            renderGallery(); updatePreview();
        }catch(e){
            $('gallery').innerHTML='<div style="color:var(--pink);font-size:12px;grid-column:1/-1;padding:18px;text-align:center">목록 로딩 실패: '+e.message+'</div>';
        }
    }

    function toast(msg,isErr){
        const t=$('toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':'');
        setTimeout(()=>{ t.className='toast'+(isErr?' err':''); },2200);
    }

    async function send(){
        const amount=rawNum('in-amount');
        if(amount<=0){ toast('후원 금액을 입력해주세요',true); $('in-amount').focus(); return; }
        const name=$('in-donor').value.trim()||'수동송출';
        const message=$('in-msg').value.trim();
        const ledger=$('in-ledger').checked;
        const btn=$('btn-send'); btn.disabled=true;
        const endpoint = ledger ? '/api/donation' : '/api/signature/play';
        const payload = ledger ? { name, amount, message, tx_id:'manual_'+Date.now() } : { name, amount, message };
        try{
            const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            const data=await res.json();
            if(data.status==='success'){
                toast('✓ 송출했습니다'+(ledger?' (장부 기록됨)':''));
                $('in-amount').value=''; $('in-donor').value=''; $('in-msg').value=''; updatePreview();
            }else{ toast('송출 실패: '+(data.message||''),true); }
        }catch(e){ toast('통신 실패: '+e.message,true); }
        finally{ btn.disabled=false; }
    }

    /* ── 후원 순위 ── */
    async function loadRanking(showEmpty){
        try{
            const res=await fetch('/api/donation/ranking');
            const data=await res.json();
            const list=data.ranking||[];
            const total=list.reduce((a,r)=>a+(r.total||0),0);
            $('stat-total').textContent=fmt(total)+'원';
            $('stat-donors').textContent=list.length+'명';
            const box=$('rank-list');
            if(!list.length){ if(showEmpty) box.innerHTML='<div class="rank-empty">아직 집계된 후원이 없습니다.<br>방송이 시작되고 후원이 들어오면 순위가 표시됩니다.</div>'; return; }
            const medals=['🥇','🥈','🥉'];
            box.innerHTML=list.map((r,i)=>{
                const topCls = i<3 ? ' top'+(i+1) : '';
                const pos = i<3 ? `<span class="medal">${medals[i]}</span>` : (i+1);
                return `<div class="rrow${topCls}">
                    <div class="pos">${pos}</div>
                    <div class="nm">${escapeHtml(r.name||'익명')}</div>
                    <div class="cnt">${r.count}회</div>
                    <div class="tot">${fmt(r.total)}원</div>
                </div>`;
            }).join('');
        }catch(e){
            $('rank-list').innerHTML='<div class="rank-empty" style="color:var(--pink)">순위 로딩 실패: '+escapeHtml(e.message)+'</div>';
        }
    }
    function startRankAuto(){ stopRankAuto(); rankTimer=setInterval(()=>loadRanking(false),8000); }
    function stopRankAuto(){ if(rankTimer){ clearInterval(rankTimer); rankTimer=null; } }

    /* ── 바인딩 ── */
    ['in-amount','in-donor','in-msg'].forEach(id=>$(id).addEventListener('input',updatePreview));
    $('in-amount').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
    $('btn-send').addEventListener('click',send);
    loadSigs();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수동 후원 송출</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="/comma_input.js"></script>
<style>
    :root{
        --bg:#0b0b0d; --panel:rgba(255,255,255,0.04); --panel-2:rgba(0,0,0,0.3);
        --border:rgba(255,255,255,0.08); --text:#fff; --muted:#8e8e93; --accent:#00ffcc;
        --gold:#ffd700; --purple:#9c27b0;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Segoe UI',sans-serif;padding:24px;min-height:100vh}
    .wrap{max-width:1080px;margin:0 auto}
    .page-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    .page-head h1{font-size:22px;font-weight:900;letter-spacing:-0.5px}
    .page-head .badge{font-size:12px;color:var(--accent);background:rgba(0,255,204,0.12);padding:4px 10px;border-radius:20px;font-weight:700}
    .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
    .sub a{color:var(--accent);text-decoration:none}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
    @media(max-width:820px){.grid{grid-template-columns:1fr}}

    /* ── 미리보기 카드 (투네이션 알림창 스타일) ── */
    .preview{background:linear-gradient(160deg,#15151a,#0d0d10);border:1px solid var(--border);border-radius:18px;padding:22px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
    .preview .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(0,255,204,0.10),transparent 60%);pointer-events:none}
    .pv-imgbox{width:220px;height:220px;border-radius:16px;overflow:hidden;background:rgba(0,0,0,0.35);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    .pv-imgbox img{width:100%;height:100%;object-fit:cover;display:none}
    .pv-empty{color:var(--muted);font-size:13px;line-height:1.6;padding:0 20px}
    .pv-title{font-size:20px;font-weight:900;margin-bottom:4px;display:none}
    .pv-amount{font-size:15px;color:var(--gold);font-weight:800;margin-bottom:14px;display:none}
    .pv-line{font-size:16px;line-height:1.5;max-width:320px}
    .pv-line .donor{color:var(--accent);font-weight:800}
    .pv-line .amt{color:var(--gold);font-weight:800}
    .pv-msg{margin-top:10px;font-size:14px;color:#e6e6e6;font-weight:600;max-width:340px;word-break:break-word;display:none}

    /* ── 컨트롤 ── */
    .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
    .fld{margin-bottom:14px}
    .fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
    .fld input,.fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:14px;padding:11px 13px;outline:none;transition:border .15s}
    .fld input:focus,.fld textarea:focus{border-color:var(--accent)}
    .fld textarea{resize:vertical;min-height:64px;font-family:inherit}
    #in-amount{font-size:20px;font-weight:800;letter-spacing:0.5px}
    .match-info{font-size:12.5px;font-weight:700;margin-top:8px;min-height:18px}
    .match-info.exact{color:var(--accent)}
    .match-info.roundup{color:var(--gold)}
    .match-info.none{color:#ff6b6b}

    .chk{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);cursor:pointer;margin:6px 0 14px}
    .chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
    .chk b{color:#ddd}

    .send-btn{width:100%;height:50px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),#00b894);color:#003;font-weight:900;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,box-shadow .2s;box-shadow:0 6px 20px rgba(0,255,204,0.25)}
    .send-btn:hover{box-shadow:0 8px 26px rgba(0,255,204,0.4)}
    .send-btn:active{transform:scale(0.98)}
    .send-btn:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none}

    /* ── 빠른 선택 갤러리 ── */
    .gal-head{font-size:13px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
    .gal-head .count{font-size:11px;color:var(--accent);background:rgba(0,255,204,0.12);padding:2px 8px;border-radius:12px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;max-height:340px;overflow-y:auto;padding:2px}
    .gcell{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border .15s,transform .1s;text-align:center}
    .gcell:hover{border-color:var(--accent)}
    .gcell.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,255,204,0.35)}
    .gcell .thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#000;display:block}
    .gcell .gamt{font-size:11px;font-weight:800;color:var(--gold);padding:5px 2px 2px}
    .gcell .gtit{font-size:10px;color:var(--muted);padding:0 3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ── 토스트 ── */
    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,255,204,0.95);color:#003;font-weight:800;font-size:14px;padding:13px 22px;border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(0.16,1,0.3,1);z-index:999}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.err{background:#ff6b6b;color:#fff}
</style>
</head>
<body>
<div class="wrap">
    <div class="page-head">
        <h1><i class="fa-solid fa-paper-plane" style="color:var(--accent)"></i> 수동 후원 송출</h1>
        <span class="badge">실시간 미리보기</span>
    </div>
    <div class="sub">금액을 입력하면 <b>매칭되는 시그니처 사진</b>이 아래에 뜹니다. 정확히 일치하는 금액이 없으면 <b>바로 윗 금액(올림)</b>으로 매칭돼요. · <a href="/controller">← 조종실로</a></div>

    <div class="grid">
        <!-- 미리보기 -->
        <div class="preview">
            <div class="glow"></div>
            <div class="pv-imgbox">
                <img id="pv-img" alt="">
                <div class="pv-empty" id="pv-empty">금액을 입력하면<br>매칭되는 시그니처가<br>여기 표시됩니다</div>
            </div>
            <div class="pv-title" id="pv-title"></div>
            <div class="pv-amount" id="pv-amount"></div>
            <div class="pv-line" id="pv-line"></div>
            <div class="pv-msg" id="pv-msg"></div>
        </div>

        <!-- 컨트롤 -->
        <div class="card">
            <div class="fld">
                <label><i class="fa-solid fa-coins" style="color:var(--gold)"></i> 후원 금액 (원)</label>
                <input type="number" id="in-amount" placeholder="예: 10000" min="0" inputmode="numeric" autocomplete="off">
                <div class="match-info" id="match-info"></div>
            </div>
            <div class="fld">
                <label><i class="fa-solid fa-user"></i> 후원자명</label>
                <input type="text" id="in-donor" placeholder="비우면 '수동송출'" autocomplete="off">
            </div>
            <div class="fld">
                <label><i class="fa-solid fa-comment"></i> 후원 메시지 (선택)</label>
                <textarea id="in-msg" placeholder="화면에 함께 표시할 메시지"></textarea>
            </div>
            <label class="chk">
                <input type="checkbox" id="in-ledger">
                <span><b>정산 장부에 기록</b> — 체크하면 실제 후원처럼 장부·승인대기함에 남고, 안 하면 재생만 됩니다.</span>
            </label>
            <button class="send-btn" id="btn-send"><i class="fa-solid fa-paper-plane"></i> 시그니처 송출</button>

            <div class="gal-head"><i class="fa-solid fa-compact-disc" style="color:var(--accent)"></i> 빠른 선택 <span class="count" id="gal-count">0개</span></div>
            <div class="gallery" id="gallery"><div style="color:var(--muted);font-size:12px;grid-column:1/-1;padding:16px;text-align:center">시그니처 목록을 불러오는 중…</div></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let SIGS = [];              // 금액 오름차순
    let currentMatchId = null;  // 현재 매칭된 시그니처 id

    const $ = id => document.getElementById(id);
    const fmt = n => (n||0).toLocaleString('ko-KR');

    // 서버 supabase_match_signature와 동일: 입력 이상인 가장 싼 시그니처 → 없으면 최고가
    function matchSig(amount){
        if(!SIGS.length) return null;
        if(amount <= 0) return null;
        for(const s of SIGS){ if((s.amount||0) >= amount) return s; }  // 오름차순이라 첫 gte가 올림 매칭
        return SIGS[SIGS.length-1];   // 다 넘으면 최고가
    }

    function updatePreview(){
        const amount = rawNum('in-amount');
        const donor = $('in-donor').value.trim() || '수동송출';
        const msg = $('in-msg').value.trim();
        const sig = matchSig(amount);
        const info = $('match-info');

        // 매칭 정보 문구
        if(amount <= 0){ info.textContent=''; info.className='match-info'; }
        else if(!sig){ info.textContent='매칭할 시그니처가 없습니다'; info.className='match-info none'; }
        else if((sig.amount||0) === amount){ info.innerHTML='✓ 정확히 일치'; info.className='match-info exact'; }
        else { info.innerHTML='↑ 올림 매칭 → <b>'+fmt(sig.amount)+'원</b> 시그니처'; info.className='match-info roundup'; }

        // 사진/제목
        currentMatchId = sig ? sig.id : null;
        const img=$('pv-img'), empty=$('pv-empty'), title=$('pv-title'), amt=$('pv-amount');
        if(sig && sig.image_url){ img.src=sig.image_url; img.style.display='block'; empty.style.display='none'; }
        else { img.style.display='none'; img.src=''; empty.style.display='block'; }
        if(sig){ title.textContent=sig.title||'시그니처'; title.style.display='block'; amt.textContent=fmt(sig.amount)+'원 시그니처'; amt.style.display='block'; }
        else { title.style.display='none'; amt.style.display='none'; }

        // 후원자/금액 라인 + 메시지 (투네이션 알림 문구 느낌)
        $('pv-line').innerHTML = amount>0
            ? '<span class="donor">'+escapeHtml(donor)+'</span>님이 <span class="amt">'+fmt(amount)+'원</span> 후원!'
            : '';
        const pvMsg=$('pv-msg');
        if(msg){ pvMsg.textContent=msg; pvMsg.style.display='block'; } else { pvMsg.style.display='none'; }

        // 갤러리 하이라이트
        document.querySelectorAll('.gcell').forEach(c=>{
            c.classList.toggle('active', currentMatchId!==null && String(c.dataset.id)===String(currentMatchId));
        });
    }

    function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function renderGallery(){
        const g=$('gallery');
        $('gal-count').textContent=SIGS.length+'개';
        if(!SIGS.length){ g.innerHTML='<div style="color:var(--muted);font-size:12px;grid-column:1/-1;padding:16px;text-align:center">등록된 시그니처가 없습니다</div>'; return; }
        g.innerHTML = SIGS.map(s=>`
            <div class="gcell" data-id="${s.id}" data-amount="${s.amount||0}" title="${escapeHtml(s.title||'')}">
                ${s.image_url?`<img class="thumb" src="${s.image_url}" alt="">`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#555"><i class="fa-solid fa-music"></i></div>`}
                <div class="gamt">${fmt(s.amount)}원</div>
                <div class="gtit">${escapeHtml(s.title||'')}</div>
            </div>`).join('');
        g.querySelectorAll('.gcell').forEach(c=>{
            c.addEventListener('click',()=>{ $('in-amount').value=c.dataset.amount; commaFormat('in-amount'); updatePreview(); $('in-amount').focus(); });
        });
    }

    async function loadSigs(){
        try{
            const res=await fetch('/api/signatures');
            const data=await res.json();
            SIGS=(data.signatures||[]).slice().sort((a,b)=>(a.amount||0)-(b.amount||0));
            renderGallery();
            updatePreview();
        }catch(e){
            $('gallery').innerHTML='<div style="color:#ff6b6b;font-size:12px;grid-column:1/-1;padding:16px;text-align:center">목록 로딩 실패: '+e.message+'</div>';
        }
    }

    function toast(msg,isErr){
        const t=$('toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':'');
        setTimeout(()=>{ t.className='toast'+(isErr?' err':''); },2200);
    }

    async function send(){
        const amount=rawNum('in-amount');
        if(amount<=0){ toast('후원 금액을 입력해주세요',true); $('in-amount').focus(); return; }
        const name=$('in-donor').value.trim()||'수동송출';
        const message=$('in-msg').value.trim();
        const ledger=$('in-ledger').checked;
        const btn=$('btn-send'); btn.disabled=true;

        const endpoint = ledger ? '/api/donation' : '/api/signature/play';
        const payload = ledger
            ? { name, amount, message, tx_id:'manual_'+Date.now() }
            : { name, amount, message };
        try{
            const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            const data=await res.json();
            if(data.status==='success'){
                toast('✓ 송출했습니다'+(ledger?' (장부 기록됨)':''));
                $('in-amount').value=''; $('in-donor').value=''; $('in-msg').value=''; updatePreview();
            }else{ toast('송출 실패: '+(data.message||''),true); }
        }catch(e){ toast('통신 실패: '+e.message,true); }
        finally{ btn.disabled=false; }
    }

    ['in-amount','in-donor','in-msg'].forEach(id=>$(id).addEventListener('input',updatePreview));
    $('in-amount').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
    $('btn-send').addEventListener('click',send);
    loadSigs();
</script>
</body>
</html>

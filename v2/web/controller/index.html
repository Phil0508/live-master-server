<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1411">
    <title>조종실 · 라이브 마스터</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f07b3f'/%3E%3Cpath d='M12 19s-6-3.8-6-8.6a3.4 3.4 0 0 1 6-2.2 3.4 3.4 0 0 1 6 2.2c0 4.8-6 8.6-6 8.6z' fill='%23fff'/%3E%3C/svg%3E">
    <!-- 🎛 v2 조종실 — 빌드 없이 그대로 돈다(ES 모듈). 바깥(CDN)에서 아무것도 안 불러온다.
         글꼴은 컴퓨터에 있는 것(Pretendard → 맑은 고딕 → 애플 고딕)을 쓴다. vendor/fonts/fonts.css 는 800KB 라 안 부른다.
         화면 넷: 연결 중 · 로그인 · 방송 전(이름 적기) · 방송 중(대기함 · 점수판 · 되돌리기 · 시그니처 · 목표) -->
    <link rel="stylesheet" href="/vendor/fonts/pretendard.css"><!-- 🔤 Pretendard(우리 서버 — 10-17) -->
    <link rel="stylesheet" href="./controller.css">
    <link rel="stylesheet" href="./css/games.css">
    <link rel="stylesheet" href="./css/tools.css">
    <link rel="stylesheet" href="./css/tools_records.css">
    <link rel="stylesheet" href="./css/tools_ops.css">
    <link rel="stylesheet" href="./css/tools_more.css"><!-- ✂️ 클립 · 📊 누른 것 · 🗓️ 월별 순위 -->
    <link rel="stylesheet" href="./css/tools_sig.css"><!-- 💿 시그니처 관리 탭 · 📱 폰 화면 손보기 -->
    <link rel="stylesheet" href="./css/tools_fx.css"><!-- 💡 조명 탭 -->
    <link rel="stylesheet" href="./css/tools_ai.css"><!-- 🧠 AI 도우미 탭 · 대기함 배지 · 🚗 띠 -->
    <link rel="stylesheet" href="./css/tools_auto.css"><!-- 🤖 자동 진행 탭 · 대기함 '자동이라면' 배지 · 머리줄 표시 -->
    <link rel="stylesheet" href="./css/donate.css"><!-- 🏷️ 대기함 칭호 · Lv · ⏸️ VIP 꺼짐 안내 · 🔁 끝난 묶음 이어 틀기 -->
    <link rel="stylesheet" href="./css/tools_cast.css"><!-- 💬 화면에 한마디 · UP 자막(오른쪽 칸 맨 위) · ✨ 이펙트 탭 -->
    <link rel="stylesheet" href="./css/tools_bank.css"><!-- 🏦 계좌 입금 추천(후원 콘솔) · 머리줄 '계좌' 점 · 계좌 띠 · 은행 확장 거울 · 탭 배지 -->
    <link rel="stylesheet" href="./css/home.css"><!-- [B] 랭킹 첫 화면 — 숫자 카드 4장(kpis.js) · 무대 줄(stagebar.js) · 점수판 · 기본 설정 -->
    <link rel="stylesheet" href="./css/mask.css"><!-- 🙈 메시지 거르기 — 대기함 · 장부 ⚠ · [가리기] · 설정 탭(10-17) -->
    <link rel="stylesheet" href="./css/side.css"><!-- [C] 오른쪽 칸 — 대기함 카드 한 장 · 추천 단추 · 폰 아래 서랍(drawer.js) -->
    <link rel="stylesheet" href="./css/bigok.css"><!-- 🛡️ 큰 금액은 한 번 더 확인 — 확인 상자 · ⚙ 설정 기준 칸(10-17 bigok) -->
    <script src="/shared/client.js"></script>
    <script type="module" src="./js/main.js"></script>
</head>
<body data-view="splash">
    <div class="app">
        <!-- 머리 두 줄(header.js): 상태 줄(.sb — 보기만 · 경보 띠 #sb-band) + 조종 줄(.cb — #ctl-bgm · #ctl-sig(#ctl-rx) · #ctl-misc · 폰 ⋯ 판 #ctl-more) -->
        <header class="hdr" id="hdr"></header>
        <div class="down-banner" id="down-banner" role="alert" hidden>서버와 연결이 끊겼어요 — 다시 붙는 중입니다. 지금 누른 것은 서버에 닿지 않을 수 있어요.</div>

        <!-- 연결 중 -->
        <section class="view v-splash" id="v-splash">
            <div class="splash-card"><span class="spin" aria-hidden="true"></span><p id="splash-msg">서버에 연결하는 중…</p></div>
        </section>

        <!-- 로그인 -->
        <section class="view v-login" id="v-login"></section>

        <!-- 방송 전 · 방송 중 공통 세 칸(시안 B 10-17) — 왼쪽 줄 · 가운데 · 오른쪽.  v-live 는 옛 이름(css 셀렉터)으로 같이 둔다.
             900px 아래(폰): 위 탭 한 줄(#rail) → 오른쪽 칸(대기함 …) → 가운데 칸. #drawer 는 [C] 폰 아래 서랍 자리. -->
        <div class="v-shell v-live" id="v-shell">
            <nav class="tabbar rail" id="rail" data-old="tabs"></nav>
            <main class="center" id="center" data-tab="home">
                <div class="stagebar" id="stagebar"></div><!-- [B] 무대 줄 · 순서표 · 진행 중인 판(stagebar.js) — 탭을 바꿔도 남는다 -->
                <div class="goal-win-slot" id="goal-win-slot"></div><!-- [B] 목표 달성 상자(goal.js 가 옮긴다) -->
                <section class="v-setup" id="v-setup"></section><!-- 방송 전 '랭킹' 자리 = 방송 준비 -->
                <div class="home" id="home"><!-- 방송 중 '랭킹' 첫 화면 -->
                    <div class="kpis" id="kpis"></div><!-- [B] 숫자 카드 4장(kpis.js) -->
                    <section class="sec scores-sec" id="scores" aria-label="점수판"></section>
                    <details class="basic" id="basic"><!-- 접힘 — 점수판 [명단] [＋ 선수] · 카드 ④ [정하기] 가 연다 -->
                        <summary>기본 설정 <small>선수 명단 · 목표 · 게이지 보정</small></summary>
                        <section class="sec goal-sec" id="goal" aria-label="목표"></section>
                    </details>
                </div>
                <div class="tabbody" id="tabbody"></div>
            </main>
            <aside class="side" id="side">
                <div class="say-slot" id="say-slot"></div><!-- 💬 화면에 한마디 · ⬆ UP 자막(castbox.js) -->
                <div class="con-mini" id="con-mini"></div><!-- [C] 후원 콘솔 미니(console.js {mini:true}) -->
                <section class="sec undo-sec" id="undo" aria-label="되돌리기"></section><!-- [C] 대기함 제목 줄 오른쪽 작은 단추로 -->
                <section class="sec pending-sec" id="pending" aria-label="대기함"></section>
                <details class="queue-fold" id="queue-fold" open>
                    <summary>시그니처 대기줄</summary>
                    <section class="sec queue-sec" id="queue" aria-label="시그니처 대기줄"></section>
                </details>
            </aside>
            <div class="drawer" id="drawer" hidden></div><!-- [C] 폰 아래 서랍(drawer.js) -->
        </div>
        <!-- 최근 기록 — undo.js 가 그리고, 왼쪽 줄 '로그' 탭(panels/frame.js)이 열릴 때 그 안으로 옮긴다 -->
        <section class="sec logs-sec" id="logs" aria-label="최근 기록" hidden></section>
    </div>
</body>
</html>

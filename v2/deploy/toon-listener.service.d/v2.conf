# 🔀 갈아타는 날 리스너가 v2 로 후원을 보내게 하는 덧붙임 — /etc/systemd/system/toon-listener.service.d/v2.conf 에 둔다.
#    되돌리기: 이 파일을 지우고 sudo systemctl daemon-reload && sudo systemctl restart toon-listener
# ⚠️ 리스너의 '못 보낸 후원 대기줄'(donation_spool.jsonl)은 옮겨 가도 그대로 다시 보내진다 — v2 도 tx_id 로 두 번 받지 않는다.
[Unit]
After=livemaster-v2.service
Requires=livemaster-v2.service

[Service]
Environment=DONATION_URL=http://127.0.0.1:5300/api/donation
